<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Controle de Frota COREN-PB</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 0;
  color: #222;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 15px;
}

.header {
  background: #07579c;
  color: white;
  text-align: center;
  padding: 22px 15px;
  border-radius: 0 0 18px 18px;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header p {
  margin: 7px 0 0;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

.card h2 {
  margin-top: 0;
  color: #07579c;
}

.card-chegada {
  border: 3px solid #07579c;
  box-shadow: 0 5px 16px rgba(7,87,156,.25);
}

.card-chegada h2 {
  font-size: 24px;
  text-align: center;
}

.saida-minimizada {
  padding: 12px 18px;
}

.saida-minimizada .conteudo-saida {
  display: none;
}

.saida-minimizada h2 {
  margin: 0;
  font-size: 18px;
}

.resumo-saida {
  display: none;
  margin-top: 10px;
  padding: 10px;
  background: #eef6fc;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
}

.saida-minimizada .resumo-saida {
  display: block;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: 3px solid rgba(7,87,156,.18);
  border-color: #07579c;
}

input:disabled,
select:disabled,
textarea:disabled,
input[readonly] {
  background: #eeeeee;
  color: #555;
  opacity: 1;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  margin-top: 18px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.btn-principal {
  background: #07579c;
  color: white;
}

.btn-pdf {
  background: #176b38;
  color: white;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.mensagem {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  text-align: center;
}

.sucesso {
  display: block;
  background: #e7f7ec;
  color: #176b38;
}

.erro {
  display: block;
  background: #fdeaea;
  color: #a11616;
}

.aviso {
  background: #fff4d8;
  border: 1px solid #e3bd57;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-weight: bold;
  text-align: center;
}

#areaChegada {
  display: none;
}

#areaEncerrada {
  display: none;
}

.encerrada {
  text-align: center;
  padding: 30px 20px;
}

.encerrada h2 {
  color: #176b38;
}

</style>
</head>


<body>

<div class="header">

  <h1>CONTROLE DE FROTA</h1>

  <p>COREN-PB</p>

</div>


<div class="container">


<!-- ===================================================
     REGISTRO DE SAÍDA
=================================================== -->

<div
  class="card"
  id="cardSaida"
>

<h2>Registro de Saída</h2>

<div
  class="resumo-saida"
  id="resumoSaida"
></div>


<div
  class="conteudo-saida"
  id="conteudoSaida"
>


<label for="motorista">
Motorista / Condutor
</label>

<input
  type="text"
  id="motorista"
  autocomplete="name"
  placeholder="Digite nome e sobrenome"
>


<label for="dataSaida">
Data de Saída
</label>

<input
  type="date"
  id="dataSaida"
>


<label for="horaSaida">
Hora de Saída
</label>

<input
  type="time"
  id="horaSaida"
>


<label for="veiculo">
Veículo
</label>

<select
  id="veiculo"
  onchange="atualizarPlaca()"
>

<option value="">
Selecione o veículo
</option>

<option
  value="SANDERO"
  data-placa="OFC-4143"
>
SANDERO — OFC-4143
</option>

<option
  value="NISSAN FRONTIER"
  data-placa="PWC-1227"
>
NISSAN FRONTIER — PWC-1227
</option>

<option
  value="NISSAN KICKS"
  data-placa="SLC-8F20"
>
NISSAN KICKS — SLC-8F20
</option>

<option
  value="NISSAN KICKS"
  data-placa="SLC-8F40"
>
NISSAN KICKS — SLC-8F40
</option>

<option
  value="NISSAN KICKS"
  data-placa="SLC-8F50"
>
NISSAN KICKS — SLC-8F50
</option>

</select>


<label for="placa">
Placa
</label>

<input
  type="text"
  id="placa"
  readonly
>


<label for="destino">
Destino
</label>

<input
  type="text"
  id="destino"
  placeholder="Digite o destino"
>


<label for="kmSaida">
KM de Saída
</label>

<input
  type="number"
  id="kmSaida"
  min="0"
  step="1"
  inputmode="numeric"
  placeholder="Digite o KM de saída"
>


<button
  class="btn-principal"
  id="btnSaida"
  onclick="registrarSaida()"
>
REGISTRAR SAÍDA
</button>


<div
  id="mensagemSaida"
  class="mensagem"
></div>


</div>
</div>



<!-- ===================================================
     REGISTRO DE CHEGADA
=================================================== -->

<div
  class="card card-chegada"
  id="areaChegada"
>

<h2>REGISTRO DE CHEGADA</h2>

<div class="aviso">
Saída registrada. Complete agora o registro de chegada.
</div>


<label for="motoristaChegada">
Motorista / Condutor
</label>

<input
  type="text"
  id="motoristaChegada"
  readonly
>


<label for="veiculoChegada">
Veículo
</label>

<input
  type="text"
  id="veiculoChegada"
  readonly
>


<label for="placaChegada">
Placa
</label>

<input
  type="text"
  id="placaChegada"
  readonly
>


<label for="dataChegada">
Data de Chegada
</label>

<input
  type="date"
  id="dataChegada"
>


<label for="kmChegada">
KM de Chegada
</label>

<input
  type="number"
  id="kmChegada"
  min="0"
  step="1"
  inputmode="numeric"
  placeholder="Digite o KM de chegada"
>


<label for="horaChegada">
Hora de Chegada
</label>

<input
  type="time"
  id="horaChegada"
>


<label for="localChegada">
Local de Chegada
</label>

<input
  type="text"
  id="localChegada"
  value="João Pessoa - PB, Sede do COREN"
>


<label for="assinatura">
Assinatura do Motorista
</label>

<textarea
  id="assinatura"
  placeholder="Digite sua assinatura / nome completo"
></textarea>


<label for="observacaoChegada">
Observação
</label>

<textarea
  id="observacaoChegada"
  placeholder="Digite a observação"
></textarea>


<button
  class="btn-principal"
  id="btnChegada"
  onclick="registrarChegada()"
>
REGISTRAR CHEGADA
</button>


<div
  id="mensagemChegada"
  class="mensagem"
></div>


<button
  class="btn-pdf"
  id="btnPDF"
  onclick="baixarPDF()"
  style="display:none"
>
BAIXAR / SALVAR EM PDF
</button>

</div>



<!-- ===================================================
     VIAGEM ENCERRADA
=================================================== -->

<div
  class="card encerrada"
  id="areaEncerrada"
>

<h2>✓ VIAGEM ENCERRADA</h2>

<p>
O registro de saída e chegada foi concluído.
</p>

<p>
Para iniciar uma nova viagem, feche o aplicativo e abra novamente.
</p>

</div>


</div>


<script>


/* =====================================================
   URL DO GOOGLE APPS SCRIPT
===================================================== */

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbzu264tIZifiObEh9mdy0ulZGgVBjhSptcb0KuBUIfDQ3ex3NKX865GidwU8Z3MsUUM/exec";


let enviandoSaida = false;

let enviandoChegada = false;

let viagemAtual = null;

let dadosPDF = null;


/* =====================================================
   FUNÇÕES AUXILIARES
===================================================== */

function valor(id) {

  return document
    .getElementById(id)
    .value
    .trim();
}


function campo(id) {

  return document.getElementById(id);
}


function mostrarMensagem(
  id,
  texto,
  tipo
) {

  const elemento = campo(id);

  elemento.textContent = texto;

  elemento.className =
    "mensagem " + tipo;
}


function limparMensagem(id) {

  const elemento = campo(id);

  elemento.textContent = "";

  elemento.className = "mensagem";
}


/* =====================================================
   DATA E HORA ATUAIS
===================================================== */

function dataHoje() {

  const agora = new Date();

  const ano =
    agora.getFullYear();

  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      agora.getDate()
    ).padStart(2, "0");

  return `${ano}-${mes}-${dia}`;
}


function horaAgora() {

  const agora = new Date();

  const hora =
    String(
      agora.getHours()
    ).padStart(2, "0");

  const minuto =
    String(
      agora.getMinutes()
    ).padStart(2, "0");

  return `${hora}:${minuto}`;
}


/* =====================================================
   VEÍCULO / PLACA
===================================================== */

function atualizarPlaca() {

  const select =
    campo("veiculo");

  const opcao =
    select.options[
      select.selectedIndex
    ];

  campo("placa").value =
    opcao &&
    opcao.dataset.placa
      ? opcao.dataset.placa
      : "";
}


/* =====================================================
   VALIDAR NOME E SOBRENOME
===================================================== */

function nomeCompletoValido(nome) {

  const partes =
    nome
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  return partes.length >= 2 &&
         partes[0].length >= 2 &&
         partes[1].length >= 2;
}


/* =====================================================
   AVISAR CAMPO FALTANDO
===================================================== */

function campoObrigatorio(
  id,
  mensagem
) {

  const elemento = campo(id);

  elemento.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

  setTimeout(function() {
    elemento.focus();
  }, 300);

  alert(mensagem);

  return false;
}


/* =====================================================
   VALIDAR SAÍDA
===================================================== */

function validarSaida() {

  const motorista =
    valor("motorista");


  if (!motorista) {

    return campoObrigatorio(
      "motorista",
      "Preencha o nome e sobrenome do motorista."
    );
  }


  if (!nomeCompletoValido(motorista)) {

    return campoObrigatorio(
      "motorista",
      "Digite pelo menos o nome e o sobrenome do motorista."
    );
  }


  if (!valor("dataSaida")) {

    return campoObrigatorio(
      "dataSaida",
      "Informe a data de saída."
    );
  }


  if (!valor("horaSaida")) {

    return campoObrigatorio(
      "horaSaida",
      "Informe a hora de saída."
    );
  }


  if (!valor("veiculo")) {

    return campoObrigatorio(
      "veiculo",
      "Selecione o veículo."
    );
  }


  if (!valor("placa")) {

    return campoObrigatorio(
      "veiculo",
      "Selecione um veículo com placa."
    );
  }


  if (!valor("destino")) {

    return campoObrigatorio(
      "destino",
      "Informe o destino."
    );
  }


  if (!valor("kmSaida")) {

    return campoObrigatorio(
      "kmSaida",
      "Informe o KM de saída."
    );
  }


  const km =
    Number(valor("kmSaida"));


  if (
    !Number.isFinite(km) ||
    km < 0
  ) {

    return campoObrigatorio(
      "kmSaida",
      "Informe um KM de saída válido."
    );
  }


  return true;
}


/* =====================================================
   REGISTRAR SAÍDA
===================================================== */

async function registrarSaida() {

  if (enviandoSaida) {
    return;
  }


  if (
    localStorage.getItem(
      "controleFrotaViagemAberta"
    )
  ) {

    alert(
      "Já existe uma saída registrada. Não é permitido registrar a saída novamente."
    );

    restaurarViagem();

    return;
  }


  if (!validarSaida()) {
    return;
  }


  limparMensagem(
    "mensagemSaida"
  );


  enviandoSaida = true;

  const botao =
    campo("btnSaida");

  botao.disabled = true;

  botao.textContent =
    "REGISTRANDO...";


  const dados = {

    acao: "saida",

    motorista:
      valor("motorista"),

    dataSaida:
      valor("dataSaida"),

    horaSaida:
      valor("horaSaida"),

    veiculo:
      valor("veiculo"),

    placa:
      valor("placa"),

    destino:
      valor("destino"),

    kmSaida:
      valor("kmSaida")
  };


  try {

    const resposta =
      await fetch(
        URL_SCRIPT,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              dados
            )
        }
      );


    const retorno =
      await resposta.json();


    if (!retorno.sucesso) {

      throw new Error(
        retorno.mensagem ||
        "Não foi possível registrar a saída."
      );
    }


    viagemAtual = dados;


    localStorage.setItem(
      "controleFrotaViagemAberta",
      JSON.stringify(dados)
    );


    mostrarMensagem(
      "mensagemSaida",
      "Saída registrada com sucesso!",
      "sucesso"
    );


    bloquearSaida();

    prepararChegada();


  } catch (erro) {

    enviandoSaida = false;

    botao.disabled = false;

    botao.textContent =
      "REGISTRAR SAÍDA";


    mostrarMensagem(
      "mensagemSaida",
      "Não foi possível registrar a saída. " +
      erro.message,
      "erro"
    );
  }
}


/* =====================================================
   BLOQUEAR E MINIMIZAR SAÍDA
===================================================== */

function bloquearSaida() {

  const ids = [
    "motorista",
    "dataSaida",
    "horaSaida",
    "veiculo",
    "destino",
    "kmSaida"
  ];


  ids.forEach(function(id) {

    campo(id).disabled = true;
  });


  campo("placa").readOnly = true;

  campo("btnSaida").disabled = true;

  campo("btnSaida").textContent =
    "SAÍDA JÁ REGISTRADA";


  const resumo =
    campo("resumoSaida");


  resumo.innerHTML =
    "<strong>Saída registrada</strong><br>" +
    viagemAtual.motorista + "<br>" +
    viagemAtual.veiculo +
    " — " +
    viagemAtual.placa + "<br>" +
    "Destino: " +
    viagemAtual.destino +
    "<br>KM saída: " +
    viagemAtual.kmSaida;


  campo("cardSaida")
    .classList
    .add("saida-minimizada");
}


/* =====================================================
   PREPARAR CHEGADA
===================================================== */

function prepararChegada() {

  campo("areaChegada")
    .style.display = "block";


  campo("motoristaChegada").value =
    viagemAtual.motorista;


  campo("veiculoChegada").value =
    viagemAtual.veiculo;


  campo("placaChegada").value =
    viagemAtual.placa;


  if (!valor("dataChegada")) {

    campo("dataChegada").value =
      dataHoje();
  }


  campo("areaChegada")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });


  setTimeout(function() {

    campo("kmChegada").focus();

  }, 500);
}


/* =====================================================
   VALIDAR CHEGADA
===================================================== */

function validarChegada() {

  if (!valor("motoristaChegada")) {

    return campoObrigatorio(
      "motoristaChegada",
      "Motorista não identificado."
    );
  }


  if (!valor("veiculoChegada")) {

    return campoObrigatorio(
      "veiculoChegada",
      "Veículo não identificado."
    );
  }


  if (!valor("placaChegada")) {

    return campoObrigatorio(
      "placaChegada",
      "Placa não identificada."
    );
  }


  if (!valor("dataChegada")) {

    return campoObrigatorio(
      "dataChegada",
      "Informe a data de chegada."
    );
  }


  if (!valor("kmChegada")) {

    return campoObrigatorio(
      "kmChegada",
      "Informe o KM de chegada."
    );
  }


  const kmSaida =
    Number(
      viagemAtual.kmSaida
    );


  const kmChegada =
    Number(
      valor("kmChegada")
    );


  if (
    !Number.isFinite(kmChegada)
  ) {

    return campoObrigatorio(
      "kmChegada",
      "Informe um KM de chegada válido."
    );
  }


  if (
    kmChegada < kmSaida
  ) {

    return campoObrigatorio(
      "kmChegada",
      "O KM de chegada não pode ser menor que o KM de saída."
    );
  }


  if (!valor("horaChegada")) {

    return campoObrigatorio(
      "horaChegada",
      "Informe a hora de chegada."
    );
  }


  if (!valor("localChegada")) {

    return campoObrigatorio(
      "localChegada",
      "Informe o local de chegada."
    );
  }


  if (!valor("assinatura")) {

    return campoObrigatorio(
      "assinatura",
      "Preencha a assinatura do motorista."
    );
  }


  if (!valor("observacaoChegada")) {

    return campoObrigatorio(
      "observacaoChegada",
      "Preencha o campo Observação. Se não houver ocorrência, digite SEM OBSERVAÇÃO."
    );
  }


  return true;
}


/* =====================================================
   REGISTRAR CHEGADA
===================================================== */

async function registrarChegada() {

  if (enviandoChegada) {
    return;
  }


  if (
    localStorage.getItem(
      "controleFrotaChegadaRegistrada"
    ) === "sim"
  ) {

    alert(
      "A chegada desta viagem já foi registrada."
    );

    return;
  }


  if (!viagemAtual) {

    alert(
      "Não existe uma saída aberta para registrar a chegada."
    );

    return;
  }


  if (!validarChegada()) {
    return;
  }


  limparMensagem(
    "mensagemChegada"
  );


  enviandoChegada = true;


  const botao =
    campo("btnChegada");


  botao.disabled = true;

  botao.textContent =
    "REGISTRANDO...";


  const dados = {

    acao: "chegada",

    motorista:
      viagemAtual.motorista,

    veiculo:
      viagemAtual.veiculo,

    placa:
      viagemAtual.placa,

    dataChegada:
      valor("dataChegada"),

    kmChegada:
      valor("kmChegada"),

    horaChegada:
      valor("horaChegada"),

    localChegada:
      valor("localChegada"),

    assinatura:
      valor("assinatura"),

    observacaoChegada:
      valor("observacaoChegada")
  };


  try {

    const resposta =
      await fetch(
        URL_SCRIPT,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              dados
            )
        }
      );


    const retorno =
      await resposta.json();


    if (!retorno.sucesso) {

      throw new Error(
        retorno.mensagem ||
        "Não foi possível registrar a chegada."
      );
    }


    localStorage.setItem(
      "controleFrotaChegadaRegistrada",
      "sim"
    );


    dadosPDF = {

      ...viagemAtual,

      ...dados,

      kmPercorrido:
        retorno.kmPercorrido
    };


    localStorage.setItem(
      "controleFrotaUltimoPDF",
      JSON.stringify(dadosPDF)
    );


    bloquearChegada();


    mostrarMensagem(
      "mensagemChegada",
      "Chegada registrada com sucesso. Agora salve o comprovante em PDF.",
      "sucesso"
    );


    campo("btnPDF")
      .style.display = "block";


    campo("btnPDF")
      .scrollIntoView({
        behavior: "smooth",
        block: "center"
      });


  } catch (erro) {

    enviandoChegada = false;

    botao.disabled = false;

    botao.textContent =
      "REGISTRAR CHEGADA";


    mostrarMensagem(
      "mensagemChegada",
      "Não foi possível registrar a chegada. " +
      erro.message,
      "erro"
    );
  }
}


/* =====================================================
   BLOQUEAR CHEGADA
===================================================== */

function bloquearChegada() {

  const ids = [

    "dataChegada",
    "kmChegada",
    "horaChegada",
    "localChegada",
    "assinatura",
    "observacaoChegada"
  ];


  ids.forEach(function(id) {

    campo(id).disabled = true;
  });


  campo("btnChegada").disabled =
    true;


  campo("btnChegada").textContent =
    "CHEGADA JÁ REGISTRADA";
}


/* =====================================================
   PDF
===================================================== */

function baixarPDF() {

  if (!dadosPDF) {

    const salvo =
      localStorage.getItem(
        "controleFrotaUltimoPDF"
      );


    if (salvo) {

      dadosPDF =
        JSON.parse(salvo);
    }
  }


  if (!dadosPDF) {

    alert(
      "Não existem dados para gerar o PDF."
    );

    return;
  }


  const janela =
    window.open(
      "",
      "_blank"
    );


  if (!janela) {

    alert(
      "O navegador bloqueou a janela do PDF. Permita pop-ups e tente novamente."
    );

    return;
  }


  const html = `

<!DOCTYPE html>

<title>Registro de Viagem - COREN-PB</title>

}

  margin-top: 25px;

}

</tr>

<tr>

<td>${escapar(dadosPDF.veiculo)}</td>
</tr>

<tr>
<td>Placa</td>
<td>${escapar(dadosPDF.placa)}</td>
</tr>

<tr>
<td>Destino</td>
<td>${escapar(dadosPDF.destino)}</td>
</tr>

<tr>
<td>KM de Saída</td>
<td>${escapar(dadosPDF.kmSaida)}</td>
</tr>

<tr>
<td>Data de Chegada</td>
<td>${escapar(dadosPDF.dataChegada)}</td>
</tr>

<tr>
<td>KM de Chegada</td>
<td>${escapar(dadosPDF.kmChegada)}</td>

  janela.document.open();

  janela.document.write(html);

  janela.document.close();


  /*
    A partir daqui a viagem fica encerrada.
    Nenhum botão poderá registrar novamente.
  */

  sessionStorage.setItem(
    "controleFrotaSessaoEncerrada",
    "sim"
  );


  localStorage.removeItem(
    "controleFrotaViagemAberta"
  );


  localStorage.removeItem(
    "controleFrotaChegadaRegistrada"
  );


  setTimeout(function() {

    encerrarTela();

/* =====================================================
   PROTEGER TEXTO DO PDF
===================================================== */

function escapar(texto) {

  return String(
    texto === undefined ||
    texto === null
      ? ""
      : texto
  )

  .replace(/&/g, "&amp;")

  .replace(/</g, "&lt;")

  .replace(/>/g, "&gt;")

  .replace(/"/g, "&quot;")

  .replace(/'/g, "&#039;");
}


/* =====================================================
   TELA ENCERRADA
===================================================== */

function encerrarTela() {

  campo("cardSaida")
    .style.display = "none";


  campo("areaChegada")
    .style.display = "none";


  campo("areaEncerrada")
    .style.display = "block";


  campo("areaEncerrada")
    .scrollIntoView({
      behavior: "smooth"
    });
}


/* =====================================================
   RESTAURAR VIAGEM ABERTA
===================================================== */

function restaurarViagem() {

  const salva =
    localStorage.getItem(
      "controleFrotaViagemAberta"
    );


  if (!salva) {
    return;
  }


  try {

    viagemAtual =
      JSON.parse(salva);


    campo("motorista").value =
      viagemAtual.motorista || "";


    campo("dataSaida").value =
      viagemAtual.dataSaida || "";


    campo("horaSaida").value =
      viagemAtual.horaSaida || "";


    campo("destino").value =
      viagemAtual.destino || "";


    campo("kmSaida").value =
      viagemAtual.kmSaida || "";


    const select =
      campo("veiculo");


    for (
      let i = 0;
      i < select.options.length;
      i++
    ) {

      const opcao =
        select.options[i];


      if (
        opcao.value ===
        viagemAtual.veiculo &&

        opcao.dataset.placa ===
        viagemAtual.placa
      ) {

        select.selectedIndex = i;

        break;
      }
    }


    campo("placa").value =
      viagemAtual.placa || "";


    bloquearSaida();


    prepararChegada();


    const chegadaRegistrada =
      localStorage.getItem(
        "controleFrotaChegadaRegistrada"
      );


    if (
      chegadaRegistrada === "sim"
    ) {

      const ultimoPDF =
        localStorage.getItem(
          "controleFrotaUltimoPDF"
        );


      if (ultimoPDF) {

        dadosPDF =
          JSON.parse(ultimoPDF);


        campo("dataChegada").value =
          dadosPDF.dataChegada || "";


        campo("kmChegada").value =
          dadosPDF.kmChegada || "";


        campo("horaChegada").value =
          dadosPDF.horaChegada || "";


        campo("localChegada").value =
          dadosPDF.localChegada || "";


        campo("assinatura").value =
          dadosPDF.assinatura || "";


        campo("observacaoChegada").value =
          dadosPDF.observacaoChegada || "";


        bloquearChegada();


        campo("btnPDF")
          .style.display = "block";
      }
    }


  } catch (erro) {

    console.error(
      "Erro ao restaurar viagem:",
      erro
    );
  }
}


/* =====================================================
   INICIAR APLICATIVO
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function() {


    /*
      Depois do PDF, atualizar a página não
      libera novo registro nesta mesma sessão.
    */

    if (
      sessionStorage.getItem(
        "controleFrotaSessaoEncerrada"
      ) === "sim"
    ) {

      encerrarTela();

      return;
    }


    /*
      Se já existe viagem aberta,
      restaura somente a chegada.
    */

    if (
      localStorage.getItem(
        "controleFrotaViagemAberta"
      )
    ) {

      restaurarViagem();

      return;
    }


    /*
      Nova viagem
    */

    campo("dataSaida").value =
      dataHoje();


    campo("horaSaida").value =
      horaAgora();


    campo("motorista").focus();
  }
);

</script>

</html>
