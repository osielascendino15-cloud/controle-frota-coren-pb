<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Frota COREN-PB</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
  background: #fff;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.10);
}

h1 {
  margin-top: 0;
  text-align: center;
  color: #075e2f;
  font-size: 25px;
}

h2 {
  color: #075e2f;
  border-bottom: 2px solid #075e2f;
  padding-bottom: 8px;
  margin-top: 30px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 7px;
  background: #fff;
}

input:disabled,
input[readonly] {
  background: #eeeeee;
  color: #444;
}

textarea {
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #999;
  cursor: wait;
}

.btn-saida {
  background: #075e2f;
  color: #fff;
}

.btn-chegada {
  background: #145da0;
  color: #fff;
}

.status {
  margin-bottom: 20px;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  background: #eee;
  color: #555;
}

.status.aberta {
  background: #dff5e5;
  color: #075e2f;
  border: 2px solid #075e2f;
}

.resultado {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  background: #eef5ef;
  color: #075e2f;
  font-weight: bold;
  text-align: center;
}

.resultado.erro {
  background: #ffecec;
  color: #a00000;
}

.km {
  text-align: right;
  font-size: 18px;
}

.km-resultado {
  margin-top: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #075e2f;
}

.observacao {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}

.info {
  margin-top: 10px;
  padding: 10px;
  background: #f4f7f5;
  border-radius: 7px;
  font-size: 14px;
  color: #555;
}

.oculto {
  display: none;
}

</style>

</head>

<body>

<div class="container">

<h1>
Controle de Frota COREN-PB
</h1>


<!-- =====================================================
STATUS DA VIAGEM
===================================================== -->

<div
  id="statusViagem"
  class="status"
>
NENHUMA VIAGEM EM ANDAMENTO
</div>


<!-- =====================================================
REGISTRO DE SAÍDA
===================================================== -->

<div id="areaSaida">

<h2>
Registro de Saída
</h2>


<label>
Motorista / Condutor
</label>

<input
  id="motorista"
  type="text"
  placeholder="Digite o nome do motorista"
>


<label>
Data de Saída
</label>

<input
  id="dataSaida"
  type="date"
>


<label>
Hora de Saída
</label>

<input
  id="horaSaida"
  type="time"
>


<label>
Veículo
</label>

<select
  id="veiculo"
  onchange="selecionarVeiculo()"
>

<option value="">
Selecione o veículo
</option>

<option
  value="SANDERO"
  data-placa="OFC-4143"
>
SANDERO — OFC-4143
</option>

<option
  value="NISSAN FRONTIER"
  data-placa="PWC-1227"
>
NISSAN FRONTIER — PWC-1227
</option>

<option
  value="NISSAN KICKS"
  data-placa="SLC-8F20"
>
NISSAN KICKS — SLC-8F20
</option>

<option
  value="NISSAN KICKS"
  data-placa="SLC-8F40"
>
NISSAN KICKS — SLC-8F40
</option>

<option
  value="NISSAN KICKS"
  data-placa="SLC-8F50"
>
NISSAN KICKS — SLC-8F50
</option>

</select>


<label>
Placa
</label>

<input
  id="placa"
  type="text"
  readonly
  placeholder="Será preenchida automaticamente"
>


<label>
Destino
</label>

<input
  id="destino"
  type="text"
  placeholder="Digite o destino"
>


<label>
KM de Saída
</label>

<input
  id="kmSaida"
  class="km"
  type="text"
  inputmode="decimal"
  placeholder="Ex.: 10.000,50"
>


<div class="observacao">
Aceita: 10000, 10000,50 ou 10.000,50.
</div>


<button
  id="btnSaida"
  class="btn-saida"
  onclick="registrarSaida()"
>
REGISTRAR SAÍDA
</button>


<div
  id="resultadoSaida"
  class="resultado"
  style="display:none"
></div>

</div>


<!-- =====================================================
REGISTRO DE CHEGADA
===================================================== -->

<div id="areaChegada">

<h2>
Registro de Chegada
</h2>


<div class="info">
Motorista, veículo e placa são trazidos automaticamente da viagem em andamento.
</div>


<label>
Motorista / Condutor
</label>

<input
  id="motoristaChegada"
  type="text"
  readonly
>


<label>
Veículo
</label>

<input
  id="veiculoChegada"
  type="text"
  readonly
>


<label>
Placa
</label>

<input
  id="placaChegada"
  type="text"
  readonly
>


<label>
Data de Chegada
</label>

<input
  id="dataChegada"
  type="date"
>


<label>
KM de Chegada
</label>

<input
  id="kmChegada"
  class="km"
  type="text"
  inputmode="decimal"
  placeholder="Ex.: 10.125,50"
>


<div class="observacao">
Informe o KM mostrado no painel na chegada.
</div>


<label>
Hora de Chegada
</label>

<input
  id="horaChegada"
  type="time"
>


<label>
Local de Chegada
</label>

<input
  id="localChegada"
  type="text"
  value="João Pessoa - PB, Sede do COREN"
>


<label>
Assinatura do Motorista
</label>

<textarea
  id="assinatura"
  rows="4"
  placeholder="Digite o nome do motorista"
></textarea>


<div class="km-resultado">

KM Percorrido:
<span id="kmPercorrido">
0
</span>

</div>


<button
  id="btnChegada"
  class="btn-chegada"
  onclick="registrarChegada()"
>
REGISTRAR CHEGADA
</button>


<div
  id="resultadoChegada"
  class="resultado"
  style="display:none"
></div>

</div>

</div>


<script>

/* =====================================================
CONFIGURAÇÃO
===================================================== */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzu264tIZifiObEh9mdy0ulZGgVBjhSptcb0KuBUIfDQ3ex3NKX865GidwU8Z3MsUUM/exec";


const CHAVE_VIAGEM =
"controleFrotaViagemAberta";


/* =====================================================
DATA ATUAL
===================================================== */

function dataAtual() {

  const agora = new Date();

  return (
    agora.getFullYear() +
    "-" +
    String(agora.getMonth() + 1).padStart(2,"0") +
    "-" +
    String(agora.getDate()).padStart(2,"0")
  );

}


/* =====================================================
HORA ATUAL
===================================================== */

function horaAtual() {

  const agora = new Date();

  return (
    String(agora.getHours()).padStart(2,"0") +
    ":" +
    String(agora.getMinutes()).padStart(2,"0")
  );

}


/* =====================================================
CONVERTER KM
===================================================== */

function converterKm(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {
    return NaN;
  }

  let texto =
    String(valor)
      .trim()
      .replace(/\s/g,"");

  if (!texto) {
    return NaN;
  }

  if (
    texto.includes(".") &&
    texto.includes(",")
  ) {

    texto =
      texto
        .replace(/\./g,"")
        .replace(",",".");
  }

  else if (
    texto.includes(",")
  ) {

    texto =
      texto.replace(",",".");
  }

  texto =
    texto.replace(
      /[^0-9.-]/g,
      ""
    );

  const numero =
    Number(texto);

  return Number.isFinite(numero)
    ? numero
    : NaN;

}


/* =====================================================
FORMATAR KM
===================================================== */

function formatarKm(valor) {

  if (
    !Number.isFinite(valor)
  ) {
    return "0";
  }

  return valor.toLocaleString(
    "pt-BR",
    {
      maximumFractionDigits: 2
    }
  );

}


/* =====================================================
ESCOLHER VEÍCULO
===================================================== */

function selecionarVeiculo() {

  const select =
    document.getElementById(
      "veiculo"
    );

  const opcao =
    select.options[
      select.selectedIndex
    ];

  const placa =
    opcao.getAttribute(
      "data-placa"
    ) || "";

  document.getElementById(
    "placa"
  ).value =
    placa;

}


/* =====================================================
SALVAR VIAGEM NO CELULAR
===================================================== */

function salvarViagem(
  dados
) {

  try {

    localStorage.setItem(
      CHAVE_VIAGEM,
      JSON.stringify(dados)
    );

    return true;

  }

  catch (erro) {

    console.error(
      "Erro ao salvar viagem:",
      erro
    );

    return false;

  }

}


/* =====================================================
LER VIAGEM DO CELULAR
===================================================== */

function lerViagem() {

  try {

    const texto =
      localStorage.getItem(
        CHAVE_VIAGEM
      );

    if (!texto) {
      return null;
    }

    return JSON.parse(
      texto
    );

  }

  catch (erro) {

    console.error(
      "Erro ao ler viagem:",
      erro
    );

    return null;

  }

}


/* =====================================================
LIMPAR VIAGEM
===================================================== */

function limparViagem() {

  try {

    localStorage.removeItem(
      CHAVE_VIAGEM
    );

  }

  catch (erro) {

    console.error(
      "Erro ao limpar viagem:",
      erro
    );

  }

}


/* =====================================================
PREENCHER DADOS DA CHEGADA
===================================================== */

function preencherChegada(
  viagem
) {

  document.getElementById(
    "motoristaChegada"
  ).value =
    viagem.motorista || "";


  document.getElementById(
    "veiculoChegada"
  ).value =
    viagem.veiculo || "";


  document.getElementById(
    "placaChegada"
  ).value =
    viagem.placa || "";


  document.getElementById(
    "dataChegada"
  ).value =
    dataAtual();


  document.getElementById(
    "horaChegada"
  ).value =
    horaAtual();

}


/* =====================================================
ATUALIZAR TELA
===================================================== */

function atualizarTela() {

  const viagem =
    lerViagem();

  const status =
    document.getElementById(
      "statusViagem"
    );

  const areaSaida =
    document.getElementById(
      "areaSaida"
    );


  if (viagem) {

    status.className =
      "status aberta";

    status.innerHTML =
      "🚗 VIAGEM EM ANDAMENTO<br><br>" +
      "Motorista: " +
      (viagem.motorista || "") +
      "<br>" +
      "Veículo: " +
      (viagem.veiculo || "") +
      "<br>" +
      "Placa: " +
      (viagem.placa || "");


    areaSaida.classList.add(
      "oculto"
    );


    preencherChegada(
      viagem
    );

  }

  else {

    status.className =
      "status";

    status.textContent =
      "NENHUMA VIAGEM EM ANDAMENTO";

    areaSaida.classList.remove(
      "oculto"
    );

  }

}


/* =====================================================
ENVIAR DADOS PARA APPS SCRIPT
===================================================== */

async function enviarDados(
  dados
) {

  const resposta =
    await fetch(
      URL_APPS_SCRIPT,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(dados),

        redirect:
          "follow"
      }
    );


  const texto =
    await resposta.text();


  let resultado;


  try {

    resultado =
      JSON.parse(texto);

  }

  catch (erro) {

    throw new Error(
      "O Google Apps Script não retornou JSON válido."
    );

  }


  if (
    !resultado ||
    resultado.sucesso !== true
  ) {

    throw new Error(
      resultado &&
      resultado.mensagem
        ? resultado.mensagem
        : "O servidor não confirmou a operação."
    );

  }


  return resultado;

}


/* =====================================================
REGISTRAR SAÍDA
===================================================== */

async function registrarSaida() {

  if (
    lerViagem()
  ) {

    mostrarResultado(
      "saida",
      "Já existe uma viagem em andamento.",
      true
    );

    atualizarTela();

    return;

  }


  const motorista =
    document.getElementById(
      "motorista"
    ).value.trim();


  const dataSaida =
    document.getElementById(
      "dataSaida"
    ).value;


  const horaSaida =
    document.getElementById(
      "horaSaida"
    ).value;


  const veiculo =
    document.getElementById(
      "veiculo"
    ).value;


  const placa =
    document.getElementById(
      "placa"
    ).value.trim().toUpperCase();


  const destino =
    document.getElementById(
      "destino"
    ).value.trim();


  const kmSaida =
    converterKm(
      document.getElementById(
        "kmSaida"
      ).value
    );


  if (!motorista) {

    mostrarResultado(
      "saida",
      "Digite o nome do motorista.",
      true
    );

    return;

  }


  if (!dataSaida) {

    mostrarResultado(
      "saida",
      "Informe a data de saída.",
      true
    );

    return;

  }


  if (!horaSaida) {

    mostrarResultado(
      "saida",
      "Informe a hora de saída.",
      true
    );

    return;

  }


  if (!veiculo) {

    mostrarResultado(
      "saida",
      "Escolha o veículo.",
      true
    );

    return;

  }


  if (!placa) {

    mostrarResultado(
      "saida",
      "A placa não foi preenchida.",
      true
    );

    return;

  }


  if (!destino) {

    mostrarResultado(
      "saida",
      "Informe o destino.",
      true
    );

    return;

  }


  if (
    !Number.isFinite(
      kmSaida
    )
  ) {

    mostrarResultado(
      "saida",
      "Informe um KM de saída válido.",
      true
    );

    return;

  }


  const dados = {

    acao:
      "saida",

    motorista:
      motorista,

    dataSaida:
      dataSaida,

    horaSaida:
      horaSaida,

    veiculo:
      veiculo,

    placa:
      placa,

    destino:
      destino,

    kmSaida:
      kmSaida

  };


  const botao =
    document.getElementById(
      "btnSaida"
    );


  botao.disabled =
    true;

  botao.textContent =
    "ENVIANDO...";


  try {

    const resultado =
      await enviarDados(
        dados
      );


    /*
    Só cria a viagem em andamento
    depois que o Google confirmou.
    */

    if (
      resultado.sucesso === true
    ) {

      salvarViagem(
        dados
      );

      atualizarTela();

      mostrarResultado(
        "saida",
        "SAÍDA REGISTRADA COM SUCESSO. VIAGEM EM ANDAMENTO.",
        false
      );

    }

  }

  catch (erro) {

    mostrarResultado(
      "saida",
      "Não foi possível registrar a saída. " +
      erro.message,
      true
    );

  }

  finally {

    botao.disabled =
      false;

    botao.textContent =
      "REGISTRAR SAÍDA";

  }

}


/* =====================================================
CALCULAR KM PERCORRIDO
===================================================== */

function calcularKmPercorrido() {

  const viagem =
    lerViagem();


  if (!viagem) {

    document.getElementById(
      "kmPercorrido"
    ).textContent =
      "0";

    return;

  }


  const kmSaida =
    converterKm(
      viagem.kmSaida
    );


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
    );


  if (
    !Number.isFinite(kmSaida) ||
    !Number.isFinite(kmChegada) ||
    kmChegada < kmSaida
  ) {

    document.getElementById(
      "kmPercorrido"
    ).textContent =
      "0";

    return;

  }


  document.getElementById(
    "kmPercorrido"
  ).textContent =
    formatarKm(
      kmChegada - kmSaida
    );

}


document.getElementById(
  "kmChegada"
).addEventListener(
  "input",
  calcularKmPercorrido
);


/* =====================================================
REGISTRAR CHEGADA
===================================================== */

async function registrarChegada() {

  const viagem =
    lerViagem();


  if (!viagem) {

    mostrarResultado(
      "chegada",
      "Nenhuma viagem em andamento.",
      true
    );

    atualizarTela();

    return;

  }


  const kmSaida =
    converterKm(
      viagem.kmSaida
    );


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
    );


  if (
    !Number.isFinite(
      kmChegada
    )
  ) {

    mostrarResultado(
      "chegada",
      "Informe o KM de chegada.",
      true
    );

    return;

  }


  if (
    kmChegada < kmSaida
  ) {

    mostrarResultado(
      "chegada",
      "O KM de chegada não pode ser menor que o KM de saída.",
      true
    );

    return;

  }


  const dataChegada =
    document.getElementById(
      "dataChegada"
    ).value;


  const horaChegada =
    document.getElementById(
      "horaChegada"
    ).value;


  const localChegada =
    document.getElementById(
      "localChegada"
    ).value.trim();


  const assinatura =
    document.getElementById(
      "assinatura"
    ).value.trim();


  if (!dataChegada) {

    mostrarResultado(
      "chegada",
      "Informe a data de chegada.",
      true
    );

    return;

  }


  if (!horaChegada) {

    mostrarResultado(
      "chegada",
      "Informe a hora de chegada.",
      true
    );

    return;

  }


  const dados = {

    acao:
      "chegada",

    motorista:
      viagem.motorista,

    veiculo:
      viagem.veiculo,

    placa:
      viagem.placa,

    dataSaida:
      viagem.dataSaida,

    horaSaida:
      viagem.horaSaida,

    destino:
      viagem.destino,

    kmSaida:
      kmSaida,

    dataChegada:
      dataChegada,

    kmChegada:
      kmChegada,

    horaChegada:
      horaChegada,

    localChegada:
      localChegada ||
      "João Pessoa - PB, Sede do COREN",

    assinatura:
      assinatura,

    kmPercorrido:
      kmChegada - kmSaida

  };


  const botao =
    document.getElementById(
      "btnChegada"
    );


  botao.disabled =
    true;

  botao.textContent =
    "ENVIANDO...";


  try {

    const resultado =
      await enviarDados(
        dados
      );


    /*
    Só encerra a viagem depois
    da confirmação do servidor.
    */

    if (
      resultado.sucesso === true
    ) {

      limparViagem();

      document.getElementById(
        "kmChegada"
      ).value = "";

      document.getElementById(
        "assinatura"
      ).value = "";

      document.getElementById(
        "kmPercorrido"
      ).textContent =
        "0";

      atualizarTela();

      mostrarResultado(
        "chegada",
        "CHEGADA REGISTRADA COM SUCESSO. VIAGEM ENCERRADA.",
        false
      );

    }

  }

  catch (erro) {

    mostrarResultado(
      "chegada",
      "Não foi possível registrar a chegada. " +
      "A viagem continua em andamento. " +
      erro.message,
      true
    );

  }

  finally {

    botao.disabled =
      false;

    botao.textContent =
      "REGISTRAR CHEGADA";

  }

}


/* =====================================================
MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  tipo,
  mensagem,
  erro
) {

  const id =
    tipo === "saida"
      ? "resultadoSaida"
      : "resultadoChegada";


  const elemento =
    document.getElementById(
      id
    );


  elemento.style.display =
    "block";


  elemento.textContent =
    mensagem;


  if (erro) {

    elemento.className =
      "resultado erro";

  }

  else {

    elemento.className =
      "resultado";

  }

}


/* =====================================================
INICIALIZAÇÃO
===================================================== */

document.getElementById(
  "dataSaida"
).value =
  dataAtual();


document.getElementById(
  "horaSaida"
).value =
  horaAtual();


document.getElementById(
  "dataChegada"
).value =
  dataAtual();


document.getElementById(
  "horaChegada"
).value =
  horaAtual();


atualizarTela();

</script>

</body>

</html>
