<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Frota COREN-PB</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f4f7;
margin:0;
padding:0;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.header{
background:#07579c;
color:white;
text-align:center;
padding:25px 15px;
border-radius:0 0 18px 18px;
}

.header h1{
margin:0;
font-size:24px;
}

.header p{
margin:8px 0 0;
}

.card{
background:white;
margin-top:20px;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.12);
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:6px;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
background:white;
}

select{
cursor:pointer;
}

input[readonly]{
background:#f5f5f5;
}

button{
width:100%;
margin-top:20px;
padding:16px;
border:0;
border-radius:8px;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.btn-saida{
background:#198754;
}

.btn-chegada{
background:#dc3545;
}

button:disabled{
background:#999;
}

#mensagem{
margin-top:15px;
padding:12px;
border-radius:8px;
text-align:center;
font-weight:bold;
display:none;
}

.sucesso{
display:block!important;
background:#d4edda;
color:#155724;
}

.erro{
display:block!important;
background:#f8d7da;
color:#721c24;
}

.km{
margin-top:15px;
padding:12px;
background:#eef5fb;
text-align:center;
border-radius:8px;
font-weight:bold;
color:#07579c;
}

#areaChegada{
display:none;
}

.status{
margin-top:15px;
padding:12px;
background:#fff3cd;
color:#856404;
border-radius:8px;
text-align:center;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🚗 CONTROLE DE FROTA</h1>
<p>COREN-PB</p>
</div>

<div class="card">

<form id="formulario">

<label>Motorista / Condutor</label>

<input
id="motorista"
type="text"
placeholder="Nome do motorista"
required
>

<label>Data de Saída</label>

<input
id="dataSaida"
type="date"
readonly
required
>

<label>Hora de Saída</label>

<input
id="horaSaida"
type="time"
required
>

<label>Veículo</label>

<select id="veiculo" required>

<option value="">
Selecione o veículo
</option>

<option value="Sandero" data-placa="OFC-4143">
Sandero - OFC-4143
</option>

<option value="Frontier" data-placa="PWC-1227">
Frontier - PWC-1227
</option>

<option value="Kicks-SLC-8F20" data-placa="SLC-8F20">
Kicks - SLC-8F20
</option>

<option value="Kicks-SLC-8F50" data-placa="SLC-8F50">
Kicks - SLC-8F50
</option>

<option value="Kicks-SLC-8F40" data-placa="SLC-8F40">
Kicks - SLC-8F40
</option>

</select>

<label>Placa</label>

<input
id="placa"
type="text"
maxlength="8"
placeholder="Placa"
readonly
required
>

<label>Destino</label>

<input
id="destino"
type="text"
placeholder="Destino"
required
>

<label>KM de Saída</label>

<input
id="kmSaida"
type="number"
min="0"
placeholder="KM de saída"
required
>

<button
id="botaoSaida"
class="btn-saida"
type="button">

🟢 SALVAR KM DE SAÍDA

</button>

<div id="status" class="status">
Nenhuma viagem em andamento.
</div>

<div id="areaChegada">

<label>Data de Chegada</label>

<input
id="dataChegada"
type="date"
readonly
>

<label>KM de Chegada</label>

<input
id="kmChegada"
type="number"
min="0"
placeholder="KM de chegada"
>

<label>Hora de Chegada</label>

<input
id="horaChegada"
type="time"
readonly
>

<div class="km">

KM PERCORRIDO:

<span id="kmPercorrido">0</span>

KM

</div>

<label>✍️ Assinatura do Motorista</label>

<input
id="assinatura"
type="text"
placeholder="Digite o nome completo do motorista"
autocomplete="name"
>

<button
id="botaoChegada"
class="btn-chegada"
type="button">

🔴 ENCERRAR VIAGEM

</button>

</div>

<div id="mensagem"></div>

</form>

</div>

</div>

<script>

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxPQx0vFT0XZbU4nUDO0NCqF2uxfpGOlhna6N9fAKE9h5mx2rVgZ3rdFFxPvclIIh4M/exec";

const formulario =
document.getElementById("formulario");

const motorista =
document.getElementById("motorista");

const dataSaida =
document.getElementById("dataSaida");

const horaSaida =
document.getElementById("horaSaida");

const veiculo =
document.getElementById("veiculo");

const placa =
document.getElementById("placa");

const destino =
document.getElementById("destino");

const kmSaida =
document.getElementById("kmSaida");

const dataChegada =
document.getElementById("dataChegada");

const kmChegada =
document.getElementById("kmChegada");

const horaChegada =
document.getElementById("horaChegada");

const assinatura =
document.getElementById("assinatura");

const botaoSaida =
document.getElementById("botaoSaida");

const botaoChegada =
document.getElementById("botaoChegada");

const areaChegada =
document.getElementById("areaChegada");

const kmPercorrido =
document.getElementById("kmPercorrido");

const mensagem =
document.getElementById("mensagem");

const status =
document.getElementById("status");


function dataAtual(){

const agora = new Date();

return agora.getFullYear()
+
"-"
+
String(agora.getMonth()+1).padStart(2,"0")
+
"-"
+
String(agora.getDate()).padStart(2,"0");

}


function horaAtual(){

const agora = new Date();

return String(agora.getHours()).padStart(2,"0")
+
":"
+
String(agora.getMinutes()).padStart(2,"0");

}


veiculo.addEventListener(
"change",
function(){

const opcaoSelecionada =
veiculo.options[veiculo.selectedIndex];

const placaSelecionada =
opcaoSelecionada.getAttribute("data-placa");

if(placaSelecionada){

placa.value =
placaSelecionada;

}else{

placa.value =
"";

}

}
);


function mostrarMensagem(texto,tipo){

mensagem.textContent =
texto;

mensagem.className =
tipo;

}


function enviarDados(dados){

return fetch(
URL_APPS_SCRIPT,
{
method:"POST",

mode:"no-cors",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify(dados)

}
);

}


window.addEventListener(
"load",
function(){

const viagem =
localStorage.getItem("viagemAberta");

if(viagem){

const dados =
JSON.parse(viagem);

motorista.value =
dados.motorista;

dataSaida.value =
dados.dataSaida || dataAtual();

horaSaida.value =
dados.horaSaida;

veiculo.value =
dados.veiculo;

placa.value =
dados.placa;

destino.value =
dados.destino;

kmSaida.value =
dados.kmSaida;

motorista.disabled =
true;

dataSaida.disabled =
true;

horaSaida.disabled =
true;

veiculo.disabled =
true;

placa.disabled =
true;

destino.disabled =
true;

kmSaida.disabled =
true;

botaoSaida.style.display =
"none";

areaChegada.style.display =
"block";

status.textContent =
"🚗 VIAGEM EM ANDAMENTO — informe o KM de chegada.";

}else{

dataSaida.value =
dataAtual();

horaSaida.value =
horaAtual();

}

}
);


botaoSaida.addEventListener(
"click",
async function(){

if(!formulario.checkValidity()){

formulario.reportValidity();

return;

}

const dados = {

acao:"saida",

dataSaida:dataSaida.value,

motorista:motorista.value.trim(),

horaSaida:horaSaida.value,

veiculo:veiculo.value,

placa:placa.value.trim().toUpperCase(),

destino:destino.value.trim(),

kmSaida:kmSaida.value

};

botaoSaida.disabled =
true;

botaoSaida.textContent =
"SALVANDO...";

try{

await enviarDados(dados);

localStorage.setItem(
"viagemAberta",
JSON.stringify(dados)
);

mostrarMensagem(
"KM de saída salvo com sucesso!",
"sucesso"
);

motorista.disabled =
true;

dataSaida.disabled =
true;

horaSaida.disabled =
true;

veiculo.disabled =
true;

placa.disabled =
true;

destino.disabled =
true;

kmSaida.disabled =
true;

botaoSaida.style.display =
"none";

areaChegada.style.display =
"block";

status.textContent =
"🚗 VIAGEM EM ANDAMENTO — informe o KM de chegada.";

}catch(erro){

mostrarMensagem(
"Erro ao salvar o KM de saída.",
"erro"
);

botaoSaida.disabled =
false;

botaoSaida.textContent =
"🟢 SALVAR KM DE SAÍDA";

}

}
);


kmChegada.addEventListener(
"input",
function(){

const saida =
Number(kmSaida.value);

const chegada =
Number(kmChegada.value);

if(
kmChegada.value !== "" &&
chegada >= saida
){

kmPercorrido.textContent =
chegada - saida;

dataChegada.value =
dataAtual();

horaChegada.value =
horaAtual();

}else{

kmPercorrido.textContent =
"0";

dataChegada.value =
"";

horaChegada.value =
"";

}

}
);


botaoChegada.addEventListener(
"click",
async function(){

if(kmChegada.value === ""){

mostrarMensagem(
"Informe o KM de chegada.",
"erro"
);

return;

}

if(assinatura.value.trim() === ""){

mostrarMensagem(
"Digite o nome do motorista no campo Assinatura.",
"erro"
);

assinatura.focus();

return;

}

const saida =
Number(kmSaida.value);

const chegada =
Number(kmChegada.value);

if(chegada < saida){

mostrarMensagem(
"O KM de chegada não pode ser menor que o KM de saída.",
"erro"
);

return;

}

const viagem =
JSON.parse(
localStorage.getItem("viagemAberta")
);

if(!viagem){

mostrarMensagem(
"Viagem não encontrada.",
"erro"
);

return;

}

const dataFinal =
dataAtual();

const horaFinal =
horaAtual();

dataChegada.value =
dataFinal;

horaChegada.value =
horaFinal;

const dados = {

acao:"chegada",

dataSaida:viagem.dataSaida,

motorista:viagem.motorista,

horaSaida:viagem.horaSaida,

veiculo:viagem.veiculo,

placa:viagem.placa,

destino:viagem.destino,

kmSaida:viagem.kmSaida,

dataChegada:dataFinal,

kmChegada:kmChegada.value,

horaChegada:horaFinal,

assinatura:assinatura.value.trim()

};

botaoChegada.disabled =
true;

botaoChegada.textContent =
"ENCERRANDO...";

try{

await enviarDados(dados);

localStorage.removeItem(
"viagemAberta"
);

mostrarMensagem(
"Viagem encerrada com sucesso!",
"sucesso"
);

status.textContent =
"Nenhuma viagem em andamento.";

formulario.reset();

dataSaida.value =
dataAtual();

horaSaida.value =
horaAtual();

areaChegada.style.display =
"none";

botaoSaida.style.display =
"block";

botaoSaida.disabled =
false;

botaoSaida.textContent =
"🟢 SALVAR KM DE SAÍDA";

motorista.disabled =
false;

dataSaida.disabled =
false;

horaSaida.disabled =
false;

veiculo.disabled =
false;

placa.disabled =
false;

destino.disabled =
false;

kmSaida.disabled =
false;

kmPercorrido.textContent =
"0";

}catch(erro){

mostrarMensagem(
"Não foi possível encerrar a viagem.",
"erro"
);

botaoChegada.disabled =
false;

botaoChegada.textContent =
"🔴 ENCERRAR VIAGEM";

}

}
);

</script>

</body>
</html>
