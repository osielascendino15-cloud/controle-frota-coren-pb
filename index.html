/* =====================================================
CONVERTER KM
===================================================== */

function converterKm(valor) {

if (
valor === null ||
valor === undefined
) {

return NaN;

}

let texto =
String(valor)
.trim()
.replace(/\s/g, "");

if (!texto) {

return NaN;

}

/*
10.000,50
vira
10000.50
*/

if (
texto.includes(".") &&
texto.includes(",")
) {

texto =
  texto
    .replace(/\./g, "")
    .replace(",", ".");

}

/*
10000,50
vira
10000.50
*/

else if (
texto.includes(",")
) {

texto =
  texto.replace(",", ".");

}

/*
Remove caracteres
inválidos
*/

texto =
texto.replace(
/[^0-9.-]/g,
""
);

const numero =
Number(texto);

return Number.isFinite(numero)
? numero
: NaN;

}

FORMATAR KM
===================================================== */

function formatarKm(valor) {

if (
!Number.isFinite(valor)
) {

return "0";

}

return valor.toLocaleString(
"pt-BR",
{
minimumFractionDigits: 0,
maximumFractionDigits: 2
}
);

}

/* =====================================================
CONFIGURAÇÃO
===================================================== */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxPQx0vFT0XZbU4nUDO0NCqF2uxfpGOlhna6N9fAKE9h5mx2rVgZ3rdFFxPvclIIh4M/exec";

/* =====================================================
FUNÇÕES AUXILIARES
===================================================== */

/* =====================================================
DATA ATUAL
===================================================== */

function dataAtual() {

const agora =
new Date();

return (
agora.getFullYear() +
"-" +
String(
agora.getMonth() + 1
).padStart(2, "0") +
"-" +
String(
agora.getDate()
).padStart(2, "0")
);

}

/* =====================================================
HORA ATUAL
===================================================== */

function horaAtual() {

const agora =
new Date();

return (
String(
agora.getHours()
).padStart(2, "0") +
":" +
String(
agora.getMinutes()
).padStart(2, "0")
);

}

/* =====================================================
CONVERTER KM
===================================================== */

function converterKm(valor) {

if (
valor === null ||
valor === undefined
) {

return NaN;

}

let texto =
String(valor)
.trim()
.replace(/\s/g, "");

if (!texto) {

return NaN;

}

/*
10.000,50
vira
10000.50
*/

if (
texto.includes(".") &&
texto.includes(",")
) {

texto =
  texto
    .replace(/\./g, "")
    .replace(",", ".");

}

/*
10000,50
vira
10000.50
*/

else if (
texto.includes(",")
) {

texto =
  texto.replace(",", ".");

}

/*
Remove caracteres inválidos
*/

texto =
texto.replace(
/[^0-9.-]/g,
""
);

const numero =
Number(texto);

return Number.isFinite(numero)
? numero
: NaN;

}

/* =====================================================
FORMATAR KM
===================================================== */

function formatarKm(valor) {

if (
!Number.isFinite(valor)
) {

return "0";

}

return valor.toLocaleString(
"pt-BR",
{
minimumFractionDigits: 0,
maximumFractionDigits: 2
}
);

}

/* =====================================================
NORMALIZAR PLACA
===================================================== */

function normalizarPlaca(placa) {

return String(
placa || ""
)
.trim()
.toUpperCase();

}

/* =====================================================
MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
tipo,
mensagem,
erro
) {

const elemento =
document.getElementById(
tipo === "saida"
? "resultadoSaida"
: "resultadoChegada"
);

elemento.style.display =
"block";

elemento.textContent =
mensagem;

if (erro) {

elemento.classList.add(
  "erro"
);

} else {

elemento.classList.remove(
  "erro"
);

}

}

/* =====================================================
ATUALIZAR STATUS DA INTERNET
===================================================== */

function atualizarStatusConexao() {

const elemento =
document.getElementById(
"statusConexao"
);

if (navigator.onLine) {

elemento.textContent =
  "● Conectado";

elemento.classList.remove(
  "status-offline"
);

} else {

elemento.textContent =
  "● Sem conexão — dados serão guardados neste celular";

elemento.classList.add(
  "status-offline"
);

}

}

/* =====================================================
INICIAR DATA E HORA
===================================================== */

document.getElementById(
"dataSaida"
).value =
dataAtual();

document.getElementById(
"horaSaida"
).value =
horaAtual();

document.getElementById(
"dataChegada"
).value =
dataAtual();

document.getElementById(
"horaChegada"
).value =
horaAtual();

/* =====================================================
STATUS DA INTERNET
===================================================== */

atualizarStatusConexao();

window.addEventListener(
"online",
function() {

atualizarStatusConexao();

enviarPendencias();

}
);

window.addEventListener(
"offline",
function() {

atualizarStatusConexao();

}
);

/* =====================================================
CALCULAR KM PERCORRIDO AUTOMATICAMENTE
===================================================== */

document.getElementById(
"kmChegada"
).addEventListener(
"input",
function() {

const saida =
  converterKm(
    document.getElementById(
      "kmSaida"
    ).value
  );

const chegada =
  converterKm(
    this.value
  );

if (
  !Number.isFinite(saida) ||
  !Number.isFinite(chegada)
) {

  document.getElementById(
    "kmPercorrido"
  ).textContent =
    "0";

  return;

}

if (
  chegada < saida
) {

  document.getElementById(
    "kmPercorrido"
  ).textContent =
    "0";

  return;

}

document.getElementById(
  "kmPercorrido"
).textContent =
  formatarKm(
    chegada - saida
  );

}
);

/* =====================================================
ENVIAR DADOS PARA O APPS SCRIPT
===================================================== */

async function enviarDados(
dados
) {

const resposta =
await fetch(
URL_APPS_SCRIPT,
{

    method: "POST",

    headers: {

      "Content-Type":
        "text/plain;charset=utf-8"

    },

    body:
      JSON.stringify(
        dados
      ),

    redirect:
      "follow"

  }
);

const texto =
await resposta.text();

let resultado;

try {

resultado =
  JSON.parse(
    texto
  );

} catch (erro) {

throw new Error(
  "O servidor não retornou uma resposta válida."
);

}

if (
!resultado ||
resultado.sucesso !== true
) {

throw new Error(
  resultado &&
  resultado.mensagem
    ? resultado.mensagem
    : "O servidor não confirmou a gravação."
);

}

return resultado;

}

REGISTRAR SAÍDA

const resultado =

botao.disabled =

/* -----------------------------------------------

  "veiculoChegada"

  veiculo;

  "placaChegada"
).value =

  "dataChegada"
).value =
  dataAtual();

document.getElementById(
  "horaChegada"
).value =
  horaAtual();

document.getElementById(
  "observacaoChegada"
).value =
  "";

/* -----------------------------------------------
   SALVAR VIAGEM ABERTA LOCALMENTE
------------------------------------------------ */

salvarViagemLocal(

} catch (erro) {

botao.disabled =
  false;

botao.textContent =
  "REGISTRAR SAÍDA";

/*
 Guarda a viagem para tentar
 enviar novamente.
*/

salvarPendente(

mostrarResultado(

  true

}

/* =====================================================
SALVAR VIAGEM ABERTA NO CELULAR
===================================================== */

function salvarViagemLocal(
dados
) {

try {

localStorage.setItem(
  "controleFrotaViagemAberta",
  JSON.stringify(
    dados
  )
);

} catch (erro) {

console.error(
  "Erro ao salvar viagem local:",
  erro
);

}

}

/* =====================================================
LIMPAR VIAGEM ABERTA
===================================================== */

function limparViagemLocal() {

try {

localStorage.removeItem(
  "controleFrotaViagemAberta"
);

} catch (erro) {

console.error(
  "Erro ao limpar viagem local:",
  erro
);

}

}

/* =====================================================
SALVAR DADOS PENDENTES
===================================================== */

function salvarPendente(
dados
) {

try {

const pendentes =
  JSON.parse(
    localStorage.getItem(
      "controleFrotaPendentes"
    ) || "[]"
  );

if (
  !Array.isArray(
    pendentes
  )
) {

  return;

}

pendentes.push({

  data:
    new Date().toISOString(),

  dados:
    dados

});

localStorage.setItem(
  "controleFrotaPendentes",
  JSON.stringify(
    pendentes
  )
);

} catch (erro) {

console.error(
  "Erro ao salvar pendência:",
  erro
);

}

}

/* =====================================================
ENVIAR PENDÊNCIAS
===================================================== */

async function enviarPendencias() {

try {

const pendentes =
  JSON.parse(
    localStorage.getItem(
      "controleFrotaPendentes"
    ) || "[]"
  );

if (

/* =====================================================

function converterKm(valor) {

if (
valor === null ||
valor === undefined

let texto =

      "."

Number(texto);

return Number.isFinite(numero)
? numero

"btnChegada"
);

botao.disabled =
true;

botao.textContent =
"ENVIANDO...";

/* =================================================
ENVIO
================================================= */

try {

const resultado =
  await enviarDados(
    dados
  );

botao.disabled =
  false;

botao.textContent =
  "REGISTRAR CHEGADA";

mostrarResultado(
  "chegada",
  resultado.mensagem ||
  "Chegada registrada na planilha!",
  false
);

/* -----------------------------------------------
   MOSTRAR KM PERCORRIDO
------------------------------------------------ */

if (
  resultado.kmPercorrido !==
  undefined &&
  resultado.kmPercorrido !==
  ""
) {

  document.getElementById(
    "kmPercorrido"
  ).textContent =
    formatarKm(
      Number(
        resultado.kmPercorrido
      )
    );

}

/* -----------------------------------------------
   LIMPAR CAMPOS DE CHEGADA
------------------------------------------------ */

document.getElementById(
  "kmChegada"
).value =
  "";

document.getElementById(
  "assinatura"
).value =
  "";

document.getElementById(
  "observacaoChegada"
).value =
  "";

/* -----------------------------------------------
   LIMPAR VIAGEM ABERTA LOCAL
------------------------------------------------ */

limparViagemLocal();

}

catch (erro) {

botao.disabled =
  false;

botao.textContent =
  "REGISTRAR CHEGADA";

salvarPendente(
  dados
);

mostrarResultado(
  "chegada",
  "Não foi possível enviar para a planilha. " +
  "Os dados foram guardados neste dispositivo. " +
  erro.message,
  true
);

}

}

/* =====================================================
SALVAR VIAGEM ABERTA NO CELULAR
===================================================== */

function salvarViagemLocal(dados) {

try {

localStorage.setItem(
  "controleFrotaViagemAberta",
  JSON.stringify(
    dados
  )
);

}

catch (erro) {

console.error(
  "Erro ao salvar viagem local:",
  erro
);

}

}

/* =====================================================
LIMPAR VIAGEM ABERTA
===================================================== */

function limparViagemLocal() {

try {

localStorage.removeItem(
  "controleFrotaViagemAberta"
);

}

catch (erro) {

console.error(
  "Erro ao limpar viagem local:",
  erro
);

}

}

/* =====================================================
SALVAR DADOS PENDENTES
===================================================== */

function salvarPendente(dados) {

try {

const pendentes =
  JSON.parse(
    localStorage.getItem(
      "controleFrotaPendentes"
    ) ||
    "[]"
  );

/*
   Evita guardar exatamente o mesmo objeto
   repetidamente em algumas situações.
*/

pendentes.push({

  data:
    new Date().toISOString(),

  dados:
    dados

});

localStorage.setItem(
  "controleFrotaPendentes",
  JSON.stringify(
    pendentes
  )
);

}

catch (erro) {

console.error(
  "Erro ao salvar pendência:",
  erro
);

}

}

/* =====================================================
ENVIAR PENDÊNCIAS
===================================================== */

async function enviarPendencias() {

try {

const pendentes =
  JSON.parse(
    localStorage.getItem(
      "controleFrotaPendentes"
    ) ||
    "[]"
  );

if (
  !Array.isArray(pendentes) ||
  pendentes.length === 0
) {

  return;

}

const restantes = [];

for (
  const item of pendentes
) {

  try {

    await enviarDados(
      item.dados
    );

  }

  catch (erro) {

    restantes.push(
      item
    );

  }

}

localStorage.setItem(
  "controleFrotaPendentes",
  JSON.stringify(
    restantes
  )
);

}

catch (erro) {

console.error(
  "Erro ao enviar pendências:",
  erro
);

}

}

/* =====================================================
DETECTAR INTERNET NOVAMENTE
===================================================== */

window.addEventListener(
"online",
function() {

enviarPendencias();

}
);

/* =====================================================
RESTAURAR VIAGEM ABERTA
===================================================== */

function restaurarViagemLocal() {

try {

const texto =
  localStorage.getItem(
    "controleFrotaViagemAberta"
  );

if (!texto) {

  return;

}

const dados =
  JSON.parse(
    texto
  );

if (!dados) {

  return;

}

/* -----------------------------------------------
   MOTORISTA
------------------------------------------------ */

if (
  dados.motorista
) {

  document.getElementById(
    "motorista"
  ).value =
    dados.motorista;

  document.getElementById(
    "motoristaChegada"
  ).value =
    dados.motorista;

}

/* -----------------------------------------------
   VEÍCULO
------------------------------------------------ */

if (
  dados.veiculo
) {

  document.getElementById(
    "veiculo"
  ).value =
    dados.veiculo;

  document.getElementById(
    "veiculoChegada"
  ).value =
    dados.veiculo;

}

/* -----------------------------------------------
   DATA DE SAÍDA
------------------------------------------------ */

if (
  dados.dataSaida
) {

  document.getElementById(
    "dataSaida"
  ).value =
    dados.dataSaida;

}

/* -----------------------------------------------
   HORA DE SAÍDA
------------------------------------------------ */

if (
  dados.horaSaida
) {

  document.getElementById(
    "horaSaida"
  ).value =
    dados.horaSaida;

}

/* -----------------------------------------------
   PLACA
------------------------------------------------ */

if (
  dados.placa
) {

  document.getElementById(
    "placa"
  ).value =
    dados.placa;

  document.getElementById(
    "placaChegada"
  ).value =
    dados.placa;

}

/* -----------------------------------------------
   DESTINO
------------------------------------------------ */

if (
  dados.destino
) {

  document.getElementById(
    "destino"
  ).value =
    dados.destino;

}

/* -----------------------------------------------
   KM DE SAÍDA
------------------------------------------------ */

if (
  dados.kmSaida !==
  undefined &&
  dados.kmSaida !==
  null
) {

  document.getElementById(
    "kmSaida"
  ).value =
    formatarKm(
      Number(
        dados.kmSaida
      )
    );

}

/* -----------------------------------------------
   OBSERVAÇÃO
------------------------------------------------ */

if (
  dados.observacao
) {

  document.getElementById(
    "observacaoSaida"
  ).value =
    dados.observacao;

  document.getElementById(
    "observacaoChegada"
  ).value =
    dados.observacao;

}

}

catch (erro) {

console.error(
  "Erro ao restaurar viagem:",
  erro
);

}

}

/* =====================================================
INICIALIZAÇÃO
===================================================== */

restaurarViagemLocal();

enviarPendencias();

</script> </body> </html>
