<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Controle de Frota COREN-PB</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #075e2f;
      font-size: 25px;
    }

    h2 {
      color: #075e2f;
      border-bottom: 2px solid #075e2f;
      padding-bottom: 8px;
      margin-top: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 7px;
      background: white;
    }

    .km {
      text-align: right;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-saida {
      background: #075e2f;
      color: white;
    }

    .btn-chegada {
      background: #145da0;
      color: white;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

    .resultado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      background: #eef5ef;
      color: #075e2f;
      font-weight: bold;
      text-align: center;
    }

    .erro {
      background: #ffecec;
      color: #a00000;
    }

    .km-resultado {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      color: #075e2f;
      margin-top: 15px;
    }

    .observacao {
      font-size: 13px;
      color: #666;
      margin-top: 5px;
    }

    .viagem-status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      background: #eef5ef;
      color: #075e2f;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">


  <h1>
    Controle de Frota COREN-PB
  </h1>


  <!-- =================================================
       STATUS DA VIAGEM
  ================================================== -->

  <div
    id="statusViagem"
    class="viagem-status"
  >
    Nenhuma viagem em andamento.
  </div>


  <!-- =================================================
       REGISTRO DE SAÍDA
  ================================================== -->

  <h2>
    Registro de Saída
  </h2>


  <label>
    Motorista / Condutor
  </label>

  <input
    id="motorista"
    type="text"
  >


  <label>
    Data de Saída
  </label>

  <input
    id="dataSaida"
    type="date"
  >


  <label>
    Hora de Saída
  </label>

  <input
    id="horaSaida"
    type="time"
  >


  <label>
    Veículo
  </label>

  <input
    id="veiculo"
    type="text"
  >


  <label>
    Placa
  </label>

  <input
    id="placa"
    type="text"
  >


  <label>
    Destino
  </label>

  <input
    id="destino"
    type="text"
  >


  <label>
    KM de Saída
  </label>

  <input
    id="kmSaida"
    class="km"
    type="text"
    inputmode="decimal"
    placeholder="Ex.: 10.000,50"
  >


  <div class="observacao">
    Pode digitar: 10000, 10000,50 ou 10.000,50.
  </div>


  <button
    id="btnSaida"
    class="btn-saida"
    onclick="registrarSaida()"
  >
    REGISTRAR SAÍDA
  </button>


  <div
    id="resultadoSaida"
    class="resultado"
    style="display:none"
  >
  </div>


  <!-- =================================================
       REGISTRO DE CHEGADA
  ================================================== -->

  <h2>
    Registro de Chegada
  </h2>


  <label>
    Motorista / Condutor
  </label>

  <input
    id="motoristaChegada"
    type="text"
  >


  <label>
    Veículo
  </label>

  <input
    id="veiculoChegada"
    type="text"
  >


  <label>
    Placa
  </label>

  <input
    id="placaChegada"
    type="text"
  >


  <label>
    Data de Chegada
  </label>

  <input
    id="dataChegada"
    type="date"
  >


  <label>
    KM de Chegada
  </label>

  <input
    id="kmChegada"
    class="km"
    type="text"
    inputmode="decimal"
    placeholder="Ex.: 10.125,50"
  >


  <div class="observacao">
    Aceita: 10125, 10125,50, 10125.50 ou 10.125,50.
  </div>


  <label>
    Hora de Chegada
  </label>

  <input
    id="horaChegada"
    type="time"
  >


  <label>
    Local de Chegada
  </label>

  <input
    id="localChegada"
    type="text"
    value="João Pessoa - PB, Sede do COREN"
  >


  <label>
    Assinatura do Motorista
  </label>

  <textarea
    id="assinatura"
    rows="4"
    placeholder="Digite o nome do motorista"
  ></textarea>


  <div class="km-resultado">

    KM Percorrido:
    <span id="kmPercorrido">
      0
    </span>

  </div>


  <button
    id="btnChegada"
    class="btn-chegada"
    onclick="registrarChegada()"
  >
    REGISTRAR CHEGADA
  </button>


  <div
    id="resultadoChegada"
    class="resultado"
    style="display:none"
  >
  </div>


</div>


<script>


/* =====================================================
   URL DO GOOGLE APPS SCRIPT
===================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzu264tIZifiObEh9mdy0ulZGgVBjhSptcb0KuBUIfDQ3ex3NKX865GidwU8Z3MsUUM/exec";


/* =====================================================
   CHAVE DA VIAGEM ABERTA
===================================================== */

const CHAVE_VIAGEM =
  "controleFrotaViagemAberta";


/* =====================================================
   DATA ATUAL
===================================================== */

function dataAtual() {

  const agora =
    new Date();

  return (
    agora.getFullYear() +
    "-" +
    String(
      agora.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      agora.getDate()
    ).padStart(2, "0")
  );

}


/* =====================================================
   HORA ATUAL
===================================================== */

function horaAtual() {

  const agora =
    new Date();

  return (
    String(
      agora.getHours()
    ).padStart(2, "0") +
    ":" +
    String(
      agora.getMinutes()
    ).padStart(2, "0")
  );

}


/* =====================================================
   CONVERTER KM
===================================================== */

function converterKm(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return NaN;

  }


  let texto =
    String(valor)
      .trim()
      .replace(/\s/g, "");


  if (!texto) {

    return NaN;

  }


  /*
  Exemplo:

  10.000,50

  vira:

  10000.50
  */

  if (
    texto.includes(".") &&
    texto.includes(",")
  ) {

    texto =
      texto
        .replace(/\./g, "")
        .replace(",", ".");

  }

  /*
  Exemplo:

  10000,50

  vira:

  10000.50
  */

  else if (
    texto.includes(",")
  ) {

    texto =
      texto.replace(",", ".");

  }


  texto =
    texto.replace(
      /[^0-9.-]/g,
      ""
    );


  const numero =
    Number(texto);


  return Number.isFinite(numero)
    ? numero
    : NaN;

}


/* =====================================================
   FORMATAR KM
===================================================== */

function formatarKm(valor) {

  if (
    !Number.isFinite(valor)
  ) {

    return "0";

  }


  return valor.toLocaleString(
    "pt-BR",
    {
      maximumFractionDigits: 2
    }
  );

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  tipo,
  mensagem,
  erro
) {

  const elemento =
    document.getElementById(
      tipo === "saida"
        ? "resultadoSaida"
        : "resultadoChegada"
    );


  elemento.style.display =
    "block";


  elemento.textContent =
    mensagem;


  if (erro) {

    elemento.classList.add(
      "erro"
    );

  }

  else {

    elemento.classList.remove(
      "erro"
    );

  }

}


/* =====================================================
   ENVIAR PARA O GOOGLE APPS SCRIPT
===================================================== */

async function enviarDados(
  dados
) {

  const resposta =
    await fetch(
      URL_APPS_SCRIPT,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(dados),

        redirect: "follow"

      }
    );


  const texto =
    await resposta.text();


  let resultado;


  try {

    resultado =
      JSON.parse(texto);

  }

  catch (erro) {

    throw new Error(
      "O servidor não retornou uma resposta válida."
    );

  }


  if (
    !resultado ||
    resultado.sucesso !== true
  ) {

    throw new Error(
      resultado &&
      resultado.mensagem
        ? resultado.mensagem
        : "O servidor não confirmou a gravação."
    );

  }


  return resultado;

}


/* =====================================================
   SALVAR VIAGEM ABERTA
===================================================== */

function salvarViagemLocal(
  dados
) {

  try {

    localStorage.setItem(
      CHAVE_VIAGEM,
      JSON.stringify(dados)
    );


  }

  catch (erro) {

    console.error(
      "Erro ao salvar viagem:",
      erro
    );

  }

}


/* =====================================================
   PEGAR VIAGEM ABERTA
===================================================== */

function obterViagemLocal() {

  try {

    const texto =
      localStorage.getItem(
        CHAVE_VIAGEM
      );


    if (!texto) {

      return null;

    }


    return JSON.parse(
      texto
    );

  }

  catch (erro) {

    console.error(
      "Erro ao ler viagem:",
      erro
    );

    return null;

  }

}


/* =====================================================
   ENCERRAR VIAGEM LOCAL
===================================================== */

function encerrarViagemLocal() {

  try {

    localStorage.removeItem(
      CHAVE_VIAGEM
    );

  }

  catch (erro) {

    console.error(
      "Erro ao encerrar viagem:",
      erro
    );

  }

}


/* =====================================================
   MOSTRAR STATUS
===================================================== */

function atualizarStatusViagem() {

  const viagem =
    obterViagemLocal();


  const status =
    document.getElementById(
      "statusViagem"
    );


  if (!viagem) {

    status.textContent =
      "Nenhuma viagem em andamento.";

    return;

  }


  status.textContent =
    "Viagem em andamento — " +
    (viagem.motorista || "") +
    " — " +
    (viagem.veiculo || "") +
    " — Placa: " +
    (viagem.placa || "");

}


/* =====================================================
   RESTAURAR VIAGEM
===================================================== */

function restaurarViagemLocal() {

  const dados =
    obterViagemLocal();


  if (!dados) {

    atualizarStatusViagem();

    return;

  }


  /*
  -----------------------------------------------
  SAÍDA
  -----------------------------------------------
  */

  document.getElementById(
    "motorista"
  ).value =
    dados.motorista || "";


  document.getElementById(
    "dataSaida"
  ).value =
    dados.dataSaida || "";


  document.getElementById(
    "horaSaida"
  ).value =
    dados.horaSaida || "";


  document.getElementById(
    "veiculo"
  ).value =
    dados.veiculo || "";


  document.getElementById(
    "placa"
  ).value =
    dados.placa || "";


  document.getElementById(
    "destino"
  ).value =
    dados.destino || "";


  document.getElementById(
    "kmSaida"
  ).value =
    Number.isFinite(
      Number(dados.kmSaida)
    )
      ? formatarKm(
          Number(dados.kmSaida)
        )
      : "";


  /*
  -----------------------------------------------
  CHEGADA
  -----------------------------------------------
  */

  document.getElementById(
    "motoristaChegada"
  ).value =
    dados.motorista || "";


  document.getElementById(
    "veiculoChegada"
  ).value =
    dados.veiculo || "";


  document.getElementById(
    "placaChegada"
  ).value =
    dados.placa || "";


  document.getElementById(
    "dataChegada"
  ).value =
    dataAtual();


  document.getElementById(
    "horaChegada"
  ).value =
    horaAtual();


  atualizarStatusViagem();

}


/* =====================================================
   CALCULAR KM PERCORRIDO
===================================================== */

function calcularKmPercorrido() {

  const viagem =
    obterViagemLocal();


  let kmSaida;


  if (viagem) {

    kmSaida =
      converterKm(
        viagem.kmSaida
      );

  }

  else {

    kmSaida =
      converterKm(
        document.getElementById(
          "kmSaida"
        ).value
      );

  }


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
    );


  const resultado =
    document.getElementById(
      "kmPercorrido"
    );


  if (

    !Number.isFinite(
      kmSaida
    ) ||

    !Number.isFinite(
      kmChegada
    ) ||

    kmChegada < kmSaida

  ) {

    resultado.textContent =
      "0";

    return 0;

  }


  const percorrido =
    kmChegada - kmSaida;


  resultado.textContent =
    formatarKm(
      percorrido
    );


  return percorrido;

}


/* =====================================================
   EVENTO KM CHEGADA
===================================================== */

document.getElementById(
  "kmChegada"
).addEventListener(
  "input",
  calcularKmPercorrido
);


/* =====================================================
   REGISTRAR SAÍDA
===================================================== */

async function registrarSaida() {

  /*
  -----------------------------------------------
  Não permite abrir outra viagem
  -----------------------------------------------
  */

  const viagemExistente =
    obterViagemLocal();


  if (viagemExistente) {

    mostrarResultado(
      "saida",
      "Já existe uma viagem em andamento. Registre a chegada antes de iniciar outra.",
      true
    );

    return;

  }


  const motorista =
    document.getElementById(
      "motorista"
    ).value.trim();


  const dataSaida =
    document.getElementById(
      "dataSaida"
    ).value;


  const horaSaida =
    document.getElementById(
      "horaSaida"
    ).value;


  const veiculo =
    document.getElementById(
      "veiculo"
    ).value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value.trim().toUpperCase();


  const destino =
    document.getElementById(
      "destino"
    ).value.trim();


  const kmSaida =
    converterKm(
      document.getElementById(
        "kmSaida"
      ).value
    );


  /*
  -----------------------------------------------
  Validação
  -----------------------------------------------
  */

  if (

    !motorista ||
    !dataSaida ||
    !horaSaida ||
    !veiculo ||
    !placa ||
    !destino

  ) {

    mostrarResultado(
      "saida",
      "Preencha todos os campos da saída.",
      true
    );

    return;

  }


  if (
    !Number.isFinite(
      kmSaida
    )
  ) {

    mostrarResultado(
      "saida",
      "Informe um KM de saída válido.",
      true
    );

    return;

  }


  /*
  -----------------------------------------------
  Dados
  -----------------------------------------------
  */

  const dados = {

    acao:
      "saida",

    motorista:
      motorista,

    dataSaida:
      dataSaida,

    horaSaida:
      horaSaida,

    veiculo:
      veiculo,

    placa:
      placa,

    destino:
      destino,

    kmSaida:
      kmSaida

  };


  const botao =
    document.getElementById(
      "btnSaida"
    );


  botao.disabled =
    true;


  botao.textContent =
    "ENVIANDO...";


  try {

    /*
    ---------------------------------------------
    Envia primeiro para a planilha
    ---------------------------------------------
    */

    const resultado =
      await enviarDados(
        dados
      );


    /*
    ---------------------------------------------
    Só salva como viagem aberta depois
    que o servidor confirmou.
    ---------------------------------------------
    */

    salvarViagemLocal(
      dados
    );


    /*
    ---------------------------------------------
    Preenche chegada
    ---------------------------------------------
    */

    document.getElementById(
      "motoristaChegada"
    ).value =
      motorista;


    document.getElementById(
      "veiculoChegada"
    ).value =
      veiculo;


    document.getElementById(
      "placaChegada"
    ).value =
      placa;


    document.getElementById(
      "dataChegada"
    ).value =
      dataAtual();


    document.getElementById(
      "horaChegada"
    ).value =
      horaAtual();


    /*
    ---------------------------------------------
    Status
    ---------------------------------------------
    */

    atualizarStatusViagem();


    mostrarResultado(
      "saida",
      resultado.mensagem ||
      "Saída registrada com sucesso.",
      false
    );


  }

  catch (erro) {

    mostrarResultado(
      "saida",
      "Não foi possível registrar a saída. " +
      erro.message,
      true
    );

  }

  finally {

    botao.disabled =
      false;

    botao.textContent =
      "REGISTRAR SAÍDA";

  }

}


/* =====================================================
   REGISTRAR CHEGADA
===================================================== */

async function registrarChegada() {

  /*
  -----------------------------------------------
  Recupera a viagem aberta
  -----------------------------------------------
  */

  const viagem =
    obterViagemLocal();


  if (!viagem) {

    mostrarResultado(
      "chegada",
      "Nenhuma viagem em andamento.",
      true
    );

    return;

  }


  /*
  -----------------------------------------------
  Dados da chegada
  -----------------------------------------------
  */

  const motorista =
    document.getElementById(
      "motoristaChegada"
    ).value.trim() ||
    viagem.motorista;


  const veiculo =
    document.getElementById(
      "veiculoChegada"
    ).value.trim() ||
    viagem.veiculo;


  const placa =
    document.getElementById(
      "placaChegada"
    ).value.trim().toUpperCase() ||
    viagem.placa;


  const dataChegada =
    document.getElementById(
      "dataChegada"
    ).value;


  const horaChegada =
    document.getElementById(
      "horaChegada"
    ).value;


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
    );


  const localChegada =
    document.getElementById(
      "localChegada"
    ).value.trim();


  const assinatura =
    document.getElementById(
      "assinatura"
    ).value.trim();


  const kmSaida =
    converterKm(
      viagem.kmSaida
    );


  /*
  -----------------------------------------------
  Validação
  -----------------------------------------------
  */

  if (!motorista) {

    mostrarResultado(
      "chegada",
      "Informe o motorista.",
      true
    );

    return;

  }


  if (!veiculo) {

    mostrarResultado(
      "chegada",
      "Informe o veículo.",
      true
    );

    return;

  }


  if (!placa) {

    mostrarResultado(
      "chegada",
      "Informe a placa.",
      true
    );

    return;

  }


  if (!dataChegada) {

    mostrarResultado(
      "chegada",
      "Informe a data de chegada.",
      true
    );

    return;

  }


  if (!horaChegada) {

    mostrarResultado(
      "chegada",
      "Informe a hora de chegada.",
      true
    );

    return;

  }


  if (
    !Number.isFinite(
      kmChegada
    )
  ) {

    mostrarResultado(
      "chegada",
      "Informe um KM de chegada válido.",
      true
    );

    return;

  }


  if (
    !Number.isFinite(
      kmSaida
    )
  ) {

    mostrarResultado(
      "chegada",
      "O KM de saída da viagem não foi encontrado.",
      true
    );

    return;

  }


  if (
    kmChegada < kmSaida
  ) {

    mostrarResultado(
      "chegada",
      "O KM de chegada não pode ser menor que o KM de saída.",
      true
    );

    return;

  }


  /*
  -----------------------------------------------
  Calcula KM percorrido
  -----------------------------------------------
  */

  const kmPercorrido =
    kmChegada - kmSaida;


  /*
  -----------------------------------------------
  Dados completos
  -----------------------------------------------
  */

  const dados = {

    acao:
      "chegada",

    motorista:
      motorista,

    veiculo:
      veiculo,

    placa:
      placa,

    dataSaida:
      viagem.dataSaida || "",

    horaSaida:
      viagem.horaSaida || "",

    destino:
      viagem.destino || "",

    kmSaida:
      kmSaida,

    dataChegada:
      dataChegada,

    kmChegada:
      kmChegada,

    horaChegada:
      horaChegada,

    localChegada:
      localChegada ||
      "João Pessoa - PB, Sede do COREN",

    assinatura:
      assinatura,

    kmPercorrido:
      kmPercorrido

  };


  /*
  -----------------------------------------------
  Botão
  -----------------------------------------------
  */

  const botao =
    document.getElementById(
      "btnChegada"
    );


  botao.disabled =
    true;


  botao.textContent =
    "ENVIANDO...";


  try {

    /*
    ---------------------------------------------
    Envia para o Apps Script
    ---------------------------------------------
    */

    const resultado =
      await enviarDados(
        dados
      );


    /*
    ---------------------------------------------
    MUITO IMPORTANTE:

    Só encerra a viagem local depois que
    o Google confirmou a gravação.
    ---------------------------------------------
    */

    if (
      resultado.sucesso === true
    ) {

      encerrarViagemLocal();


      /*
      -------------------------------------------
      Limpa campos da chegada
      -------------------------------------------
      */

      document.getElementById(
        "kmChegada"
      ).value = "";


      document.getElementById(
        "assinatura"
      ).value = "";


      document.getElementById(
        "kmPercorrido"
      ).textContent =
        "0";


      /*
      -------------------------------------------
      Limpa campos da saída
      -------------------------------------------
      */

      document.getElementById(
        "motorista"
      ).value = "";


      document.getElementById(
        "veiculo"
      ).value = "";


      document.getElementById(
        "placa"
      ).value = "";


      document.getElementById(
        "destino"
      ).value = "";


      document.getElementById(
        "kmSaida"
      ).value = "";


      atualizarStatusViagem();


      mostrarResultado(
        "chegada",
        resultado.mensagem ||
        "Chegada registrada com sucesso. Viagem encerrada.",
        false
      );

    }


  }

  catch (erro) {

    /*
    ---------------------------------------------
    NÃO apaga a viagem se houver erro.
    ---------------------------------------------
    */

    mostrarResultado(
      "chegada",
      "Não foi possível registrar a chegada. " +
      "A viagem continua salva neste celular. " +
      erro.message,
      true
    );

  }

  finally {

    botao.disabled =
      false;

    botao.textContent =
      "REGISTRAR CHEGADA";

  }

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.getElementById(
  "dataSaida"
).value =
  dataAtual();


document.getElementById(
  "horaSaida"
).value =
  horaAtual();


document.getElementById(
  "dataChegada"
).value =
  dataAtual();


document.getElementById(
  "horaChegada"
).value =
  horaAtual();


restaurarViagemLocal();


atualizarStatusViagem();

</script>
