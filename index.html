<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Controle de Frota COREN-PB</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.header {
  background: #07579c;
  color: white;
  text-align: center;
  padding: 25px 15px;
  border-radius: 0 0 18px 18px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header p {
  margin: 8px 0 0;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: 0;
  border-radius: 8px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.btn-saida {
  background: #198754;
}

.btn-chegada {
  background: #dc3545;
}

.btn-limpar {
  background: #6c757d;
  margin-top: 10px;
}

button:disabled {
  background: #999;
}

#mensagem {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  display: none;
}

.sucesso {
  display: block !important;
  background: #d4edda;
  color: #155724;
}

.erro {
  display: block !important;
  background: #f8d7da;
  color: #721c24;
}

.km {
  margin-top: 15px;
  padding: 12px;
  background: #eef5fb;
  text-align: center;
  border-radius: 8px;
  font-weight: bold;
  color: #07579c;
}

#areaChegada {
  display: none;
}

.status {
  margin-top: 15px;
  padding: 12px;
  background: #fff3cd;
  color: #856404;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
}

.assinatura-titulo {
  margin-top: 20px;
  font-weight: bold;
}

#areaAssinatura {
  position: relative;
  width: 100%;
  height: 180px;
  margin-top: 8px;
  border: 2px solid #07579c;
  border-radius: 8px;
  background: white;
  overflow: hidden;
}

#canvasAssinatura {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.aviso-assinatura {
  text-align: center;
  font-size: 13px;
  color: #666;
  margin-top: 6px;
}

.linha-assinatura {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 35px;
  border-bottom: 1px dashed #aaa;
  pointer-events: none;
}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>🚗 CONTROLE DE FROTA</h1>

<p>COREN-PB</p>

</div>


<div class="card">


<form id="formulario">


<label>Motorista</label>

<input
id="motorista"
type="text"
required
>


<label>Hora de Saída</label>

<input
id="horaSaida"
type="time"
required
>


<label>Veículo</label>

<input
id="veiculo"
type="text"
required
>


<label>Placa</label>

<input
id="placa"
type="text"
maxlength="7"
required
>


<label>Destino</label>

<input
id="destino"
type="text"
required
>


<label>KM de Saída</label>

<input
id="kmSaida"
type="number"
min="0"
required
>


<button
id="botaoSaida"
class="btn-saida"
type="button">

🟢 SALVAR KM DE SAÍDA

</button>


<div
id="status"
class="status">

Nenhuma viagem em andamento.

</div>


<div id="areaChegada">


<label>KM de Chegada</label>

<input
id="kmChegada"
type="number"
min="0"
>


<label>Hora de Chegada</label>

<input
id="horaChegada"
type="time"
readonly
>


<div class="km">

KM PERCORRIDO:

<span id="kmPercorrido">0</span>

KM

</div>


<div class="assinatura-titulo">

✍️ Assinatura do Motorista

</div>


<div id="areaAssinatura">

<canvas id="canvasAssinatura"></canvas>

<div class="linha-assinatura"></div>

</div>


<div class="aviso-assinatura">

Assine dentro do quadro usando o dedo.

</div>


<button
id="botaoLimpar"
class="btn-limpar"
type="button">

🗑️ LIMPAR ASSINATURA

</button>


<button
id="botaoChegada"
class="btn-chegada"
type="button">

🔴 ENCERRAR VIAGEM

</button>


</div>


<div id="mensagem"></div>


</form>


</div>


</div>


<!-- BIBLIOTECA DE ASSINATURA -->

<script src="https://cdn.jsdelivr.net/npm/signature_pad@5.0.3/dist/signature_pad.umd.min.js"></script>


<script>


/* =========================
   CONFIGURAÇÃO
========================= */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxPQx0vFT0XZbU4nUDO0NCqF2uxfpGOlhna6N9fAKE9h5mx2rVgZ3rdFFxPvclIIh4M/exec";


/* =========================
   ELEMENTOS
========================= */

const formulario =
document.getElementById("formulario");

const motorista =
document.getElementById("motorista");

const horaSaida =
document.getElementById("horaSaida");

const veiculo =
document.getElementById("veiculo");

const placa =
document.getElementById("placa");

const destino =
document.getElementById("destino");

const kmSaida =
document.getElementById("kmSaida");

const kmChegada =
document.getElementById("kmChegada");

const horaChegada =
document.getElementById("horaChegada");

const botaoSaida =
document.getElementById("botaoSaida");

const botaoChegada =
document.getElementById("botaoChegada");

const botaoLimpar =
document.getElementById("botaoLimpar");

const areaChegada =
document.getElementById("areaChegada");

const kmPercorrido =
document.getElementById("kmPercorrido");

const mensagem =
document.getElementById("mensagem");

const status =
document.getElementById("status");

const canvas =
document.getElementById("canvasAssinatura");


/* =========================
   ASSINATURA
========================= */

let assinaturaPad = null;


function criarAssinatura() {

  assinaturaPad =
    new SignaturePad(
      canvas,
      {
        backgroundColor: "rgb(255,255,255)",
        penColor: "rgb(0,0,0)",
        minWidth: 1,
        maxWidth: 3
      }
    );

  ajustarCanvas();

}


function ajustarCanvas() {

  const proporcao =
    Math.max(
      window.devicePixelRatio || 1,
      1
    );

  const largura =
    canvas.offsetWidth;

  const altura =
    canvas.offsetHeight;

  canvas.width =
    largura * proporcao;

  canvas.height =
    altura * proporcao;

  canvas.getContext("2d")
    .scale(
      proporcao,
      proporcao
    );

  if (assinaturaPad) {

    assinaturaPad.clear();

  }

}


window.addEventListener(
"resize",
function() {

  ajustarCanvas();

});


/* =========================
   HORA ATUAL
========================= */

function horaAtual() {

  const agora =
    new Date();

  return String(
    agora.getHours()
  ).padStart(2,"0")
  +
  ":"
  +
  String(
    agora.getMinutes()
  ).padStart(2,"0");

}


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(
  texto,
  tipo
) {

  mensagem.textContent =
    texto;

  mensagem.className =
    tipo;

}


/* =========================
   ENVIAR PARA APPS SCRIPT
========================= */

function enviarDados(dados) {

  return fetch(
    URL_APPS_SCRIPT,
    {
      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type":
        "text/plain;charset=utf-8"
      },

      body:
      JSON.stringify(dados)
    }
  );

}


/* =========================
   INICIAR
========================= */

window.addEventListener(
"load",
function() {

  criarAssinatura();

  const viagem =
    localStorage.getItem(
      "viagemAberta"
    );

  if (viagem) {

    const dados =
      JSON.parse(viagem);

    motorista.value =
      dados.motorista;

    horaSaida.value =
      dados.horaSaida;

    veiculo.value =
      dados.veiculo;

    placa.value =
      dados.placa;

    destino.value =
      dados.destino;

    kmSaida.value =
      dados.kmSaida;

    bloquearSaida();

  } else {

    horaSaida.value =
      horaAtual();

  }

});


/* =========================
   BLOQUEAR CAMPOS
========================= */

function bloquearSaida() {

  motorista.disabled =
    true;

  horaSaida.disabled =
    true;

  veiculo.disabled =
    true;

  placa.disabled =
    true;

  destino.disabled =
    true;

  kmSaida.disabled =
    true;

  botaoSaida.style.display =
    "none";

  areaChegada.style.display =
    "block";

  status.textContent =
    "🚗 VIAGEM EM ANDAMENTO — informe o KM de chegada.";

}


/* =========================
   SALVAR SAÍDA
========================= */

botaoSaida.addEventListener(
"click",
async function() {

  if (
    !formulario.checkValidity()
  ) {

    formulario.reportValidity();

    return;

  }


  const dados = {

    acao: "saida",

    motorista:
      motorista.value.trim(),

    horaSaida:
      horaSaida.value,

    veiculo:
      veiculo.value.trim(),

    placa:
      placa.value
        .trim()
        .toUpperCase(),

    destino:
      destino.value.trim(),

    kmSaida:
      kmSaida.value

  };


  botaoSaida.disabled =
    true;

  botaoSaida.textContent =
    "SALVANDO...";


  try {

    await enviarDados(dados);


    localStorage.setItem(
      "viagemAberta",
      JSON.stringify(dados)
    );


    mostrarMensagem(
      "KM de saída salvo com sucesso!",
      "sucesso"
    );


    bloquearSaida();


  }

  catch (erro) {

    mostrarMensagem(
      "Erro ao salvar o KM de saída.",
      "erro"
    );


    botaoSaida.disabled =
      false;

    botaoSaida.textContent =
      "🟢 SALVAR KM DE SAÍDA";

  }

});


/* =========================
   KM DE CHEGADA
========================= */

kmChegada.addEventListener(
"input",
function() {

  const saida =
    Number(kmSaida.value);

  const chegada =
    Number(kmChegada.value);


  if (
    kmChegada.value !== "" &&
    chegada >= saida
  ) {

    kmPercorrido.textContent =
      chegada - saida;

    /*
      HORA AUTOMÁTICA
    */

    horaChegada.value =
      horaAtual();

  }

  else {

    kmPercorrido.textContent =
      "0";

    horaChegada.value =
      "";

  }

});


/* =========================
   LIMPAR ASSINATURA
========================= */

botaoLimpar.addEventListener(
"click",
function() {

  if (assinaturaPad) {

    assinaturaPad.clear();

  }

});


/* =========================
   ENCERRAR VIAGEM
========================= */

botaoChegada.addEventListener(
"click",
async function() {


  if (
    kmChegada.value === ""
  ) {

    mostrarMensagem(
      "Informe o KM de chegada.",
      "erro"
    );

    return;

  }


  const saida =
    Number(kmSaida.value);

  const chegada =
    Number(kmChegada.value);


  if (
    chegada < saida
  ) {

    mostrarMensagem(
      "O KM de chegada não pode ser menor que o KM de saída.",
      "erro"
    );

    return;

  }


  /* VERIFICAR ASSINATURA */

  if (
    !assinaturaPad ||
    assinaturaPad.isEmpty()
  ) {

    mostrarMensagem(
      "Faça a assinatura do motorista antes de encerrar a viagem.",
      "erro"
    );

    return;

  }


  const viagem =
    JSON.parse(
      localStorage.getItem(
        "viagemAberta"
      )
    );


  if (!viagem) {

    mostrarMensagem(
      "Viagem não encontrada.",
      "erro"
    );

    return;

  }


  /* HORA FINAL */

  const horaFinal =
    horaAtual();

  horaChegada.value =
    horaFinal;


  /* IMAGEM DA ASSINATURA */

  const assinatura =
    assinaturaPad.toDataURL(
      "image/png"
    );


  /* DADOS */

  const dados = {

    acao: "chegada",

    motorista:
      viagem.motorista,

    horaSaida:
      viagem.horaSaida,

    veiculo:
      viagem.veiculo,

    placa:
      viagem.placa,

    destino:
      viagem.destino,

    kmSaida:
      viagem.kmSaida,

    kmChegada:
      kmChegada.value,

    horaChegada:
      horaFinal,

    assinatura:
      assinatura

  };


  botaoChegada.disabled =
    true;

  botaoLimpar.disabled =
    true;

  botaoChegada.textContent =
    "ENCERRANDO...";


  try {

    await enviarDados(dados);


    localStorage.removeItem(
      "viagemAberta"
    );


    mostrarMensagem(
      "Viagem encerrada com sucesso!",
      "sucesso"
    );


    status.textContent =
      "Nenhuma viagem em andamento.";


    formulario.reset();


    horaSaida.value =
      horaAtual();


    areaChegada.style.display =
      "none";


    botaoSaida.style.display =
      "block";


    botaoSaida.disabled =
      false;


    botaoSaida.textContent =
      "🟢 SALVAR KM DE SAÍDA";


    motorista.disabled =
      false;

    horaSaida.disabled =
      false;

    veiculo.disabled =
      false;

    placa.disabled =
      false;

    destino.disabled =
      false;

    kmSaida.disabled =
      false;


    botaoLimpar.disabled =
      false;


    kmPercorrido.textContent =
      "0";


    assinaturaPad.clear();

  }

  catch (erro) {

    mostrarMensagem(
      "Não foi possível encerrar a viagem.",
      "erro"
    );


    botaoChegada.disabled =
      false;

    botaoLimpar.disabled =
      false;

    botaoChegada.textContent =
      "🔴 ENCERRAR VIAGEM";

  }

});

</script>

</body>

</html>
