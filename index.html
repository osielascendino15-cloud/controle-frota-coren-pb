<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Frota COREN-PB</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.10);
}

h1 {
  margin-top: 0;
  text-align: center;
  color: #075e2f;
}

h2 {
  color: #075e2f;
  border-bottom: 2px solid #075e2f;
  padding-bottom: 8px;
  margin-top: 30px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 7px;
  background: white;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #999;
}

.btn-saida {
  background: #075e2f;
  color: white;
}

.btn-chegada {
  background: #145da0;
  color: white;
}

.status {
  margin: 15px 0;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  background: #eee;
  color: #555;
}

.status.aberta {
  background: #dff5e5;
  color: #075e2f;
  border: 2px solid #075e2f;
}

.status.fechada {
  background: #eee;
  color: #555;
}

.resultado {
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  background: #eef5ef;
  color: #075e2f;
  font-weight: bold;
  text-align: center;
}

.erro {
  background: #ffecec;
  color: #a00000;
}

.km {
  text-align: right;
  font-size: 18px;
}

.km-resultado {
  margin-top: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #075e2f;
}

.observacao {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
}

.oculto {
  display: none;
}

</style>

</head>

<body>

<div class="container">

<h1>Controle de Frota COREN-PB</h1>


<!-- =================================================
STATUS
================================================= -->

<div id="statusViagem" class="status fechada">
  NENHUMA VIAGEM EM ANDAMENTO
</div>


<!-- =================================================
SAÍDA
================================================= -->

<div id="areaSaida">

<h2>Registro de Saída</h2>

<label>Motorista / Condutor</label>

<input id="motorista" type="text">


<label>Data de Saída</label>

<input id="dataSaida" type="date">


<label>Hora de Saída</label>

<input id="horaSaida" type="time">


<label>Veículo</label>

<input id="veiculo" type="text">


<label>Placa</label>

<input id="placa" type="text">


<label>Destino</label>

<input id="destino" type="text">


<label>KM de Saída</label>

<input
  id="kmSaida"
  class="km"
  type="text"
  inputmode="decimal"
  placeholder="Ex.: 10.000,50"
>


<div class="observacao">
Pode digitar: 10000, 10000,50 ou 10.000,50.
</div>


<button
  id="btnSaida"
  class="btn-saida"
  onclick="registrarSaida()"
>
REGISTRAR SAÍDA
</button>


<div
  id="resultadoSaida"
  class="resultado"
  style="display:none"
></div>

</div>


<!-- =================================================
CHEGADA
================================================= -->

<div id="areaChegada">

<h2>Registro de Chegada</h2>

<label>Motorista / Condutor</label>

<input id="motoristaChegada" type="text">


<label>Veículo</label>

<input id="veiculoChegada" type="text">


<label>Placa</label>

<input id="placaChegada" type="text">


<label>Data de Chegada</label>

<input id="dataChegada" type="date">


<label>KM de Chegada</label>

<input
  id="kmChegada"
  class="km"
  type="text"
  inputmode="decimal"
  placeholder="Ex.: 10.125,50"
>


<div class="observacao">
Aceita: 10125, 10125,50 ou 10.125,50.
</div>


<label>Hora de Chegada</label>

<input id="horaChegada" type="time">


<label>Local de Chegada</label>

<input
  id="localChegada"
  type="text"
  value="João Pessoa - PB, Sede do COREN"
>


<label>Assinatura do Motorista</label>

<textarea
  id="assinatura"
  rows="4"
  placeholder="Digite o nome do motorista"
></textarea>


<div class="km-resultado">

KM Percorrido:
<span id="kmPercorrido">0</span>

</div>


<button
  id="btnChegada"
  class="btn-chegada"
  onclick="registrarChegada()"
>
REGISTRAR CHEGADA
</button>


<div
  id="resultadoChegada"
  class="resultado"
  style="display:none"
></div>

</div>

</div>


<script>


/* =====================================================
URL DO GOOGLE APPS SCRIPT
===================================================== */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzu264tIZifiObEh9mdy0ulZGgVBjhSptcb0KuBUIfDQ3ex3NKX865GidwU8Z3MsUUM/exec";


/* =====================================================
CHAVE DO CELULAR
===================================================== */

const CHAVE_VIAGEM =
"controleFrotaViagemAberta";


/* =====================================================
DATA
===================================================== */

function dataAtual() {

  const agora = new Date();

  return agora.getFullYear() +
    "-" +
    String(agora.getMonth() + 1).padStart(2,"0") +
    "-" +
    String(agora.getDate()).padStart(2,"0");

}


/* =====================================================
HORA
===================================================== */

function horaAtual() {

  const agora = new Date();

  return String(
    agora.getHours()
  ).padStart(2,"0") +
  ":" +
  String(
    agora.getMinutes()
  ).padStart(2,"0");

}


/* =====================================================
KM
===================================================== */

function converterKm(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {
    return NaN;
  }

  let texto =
    String(valor)
      .trim()
      .replace(/\s/g,"");

  if (!texto) {
    return NaN;
  }

  if (
    texto.includes(".") &&
    texto.includes(",")
  ) {

    texto =
      texto
        .replace(/\./g,"")
        .replace(",",".");
  }

  else if (
    texto.includes(",")
  ) {

    texto =
      texto.replace(",",".");
  }

  texto =
    texto.replace(
      /[^0-9.-]/g,
      ""
    );

  const numero =
    Number(texto);

  return Number.isFinite(numero)
    ? numero
    : NaN;

}


/* =====================================================
FORMATAR KM
===================================================== */

function formatarKm(valor) {

  if (!Number.isFinite(valor)) {
    return "0";
  }

  return valor.toLocaleString(
    "pt-BR",
    {
      maximumFractionDigits: 2
    }
  );

}


/* =====================================================
SALVAR VIAGEM
===================================================== */

function salvarViagem(dados) {

  localStorage.setItem(
    CHAVE_VIAGEM,
    JSON.stringify(dados)
  );

}


/* =====================================================
LER VIAGEM
===================================================== */

function lerViagem() {

  const texto =
    localStorage.getItem(
      CHAVE_VIAGEM
    );

  if (!texto) {
    return null;
  }

  try {

    return JSON.parse(texto);

  }

  catch (erro) {

    return null;

  }

}


/* =====================================================
ENCERRAR VIAGEM
===================================================== */

function encerrarViagem() {

  localStorage.removeItem(
    CHAVE_VIAGEM
  );

  atualizarTela();

}


/* =====================================================
ATUALIZAR TELA
===================================================== */

function atualizarTela() {

  const viagem =
    lerViagem();

  const status =
    document.getElementById(
      "statusViagem"
    );

  const areaSaida =
    document.getElementById(
      "areaSaida"
    );

  const areaChegada =
    document.getElementById(
      "areaChegada"
    );


  if (viagem) {

    status.className =
      "status aberta";

    status.innerHTML =
      "🚗 VIAGEM EM ANDAMENTO<br>" +
      "Motorista: " +
      viagem.motorista +
      "<br>" +
      "Veículo: " +
      viagem.veiculo +
      "<br>" +
      "Placa: " +
      viagem.placa;


    areaSaida.classList.add(
      "oculto"
    );


    areaChegada.classList.remove(
      "oculto"
    );


  }

  else {

    status.className =
      "status fechada";

    status.textContent =
      "NENHUMA VIAGEM EM ANDAMENTO";


    areaSaida.classList.remove(
      "oculto"
    );


    areaChegada.classList.remove(
      "oculto"
    );

  }

}


/* =====================================================
ENVIAR DADOS
===================================================== */

async function enviarDados(dados) {

  const resposta =
    await fetch(
      URL_APPS_SCRIPT,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(dados)

      }
    );


  const texto =
    await resposta.text();


  let resultado;


  try {

    resultado =
      JSON.parse(texto);

  }

  catch (erro) {

    throw new Error(
      "Resposta inválida do servidor."
    );

  }


  if (
    !resultado ||
    resultado.sucesso !== true
  ) {

    throw new Error(
      resultado.mensagem ||
      "O servidor não confirmou a operação."
    );

  }


  return resultado;

}


/* =====================================================
REGISTRAR SAÍDA
===================================================== */

async function registrarSaida() {

  if (lerViagem()) {

    alert(
      "Já existe uma viagem em andamento."
    );

    return;

  }


  const motorista =
    document.getElementById(
      "motorista"
    ).value.trim();


  const dataSaida =
    document.getElementById(
      "dataSaida"
    ).value;


  const horaSaida =
    document.getElementById(
      "horaSaida"
    ).value;


  const veiculo =
    document.getElementById(
      "veiculo"
    ).value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value.trim().toUpperCase();


  const destino =
    document.getElementById(
      "destino"
    ).value.trim();


  const kmSaida =
    converterKm(
      document.getElementById(
        "kmSaida"
      ).value
    );


  if (
    !motorista ||
    !dataSaida ||
    !horaSaida ||
    !veiculo ||
    !placa ||
    !destino
  ) {

    mostrarResultado(
      "saida",
      "Preencha todos os campos.",
      true
    );

    return;

  }


  if (
    !Number.isFinite(kmSaida)
  ) {

    mostrarResultado(
      "saida",
      "Informe um KM de saída válido.",
      true
    );

    return;

  }


  const dados = {

    acao:
      "saida",

    motorista:
      motorista,

    dataSaida:
      dataSaida,

    horaSaida:
      horaSaida,

    veiculo:
      veiculo,

    placa:
      placa,

    destino:
      destino,

    kmSaida:
      kmSaida

  };


  const botao =
    document.getElementById(
      "btnSaida"
    );


  botao.disabled =
    true;

  botao.textContent =
    "ENVIANDO...";


  try {

    const resultado =
      await enviarDados(
        dados
      );


    /*
    ==============================================
    IMPORTANTE:

    AQUI o aplicativo salva a viagem.
    ==============================================
    */

    salvarViagem(
      dados
    );


    /*
    Preenche a chegada.
    */

    document.getElementById(
      "motoristaChegada"
    ).value =
      motorista;


    document.getElementById(
      "veiculoChegada"
    ).value =
      veiculo;


    document.getElementById(
      "placaChegada"
    ).value =
      placa;


    document.getElementById(
      "dataChegada"
    ).value =
      dataAtual();


    document.getElementById(
      "horaChegada"
    ).value =
      horaAtual();


    /*
    Atualiza a tela.
    */

    atualizarTela();


    mostrarResultado(
      "saida",
      "SAÍDA REGISTRADA! A viagem está em andamento.",
      false
    );


  }

  catch (erro) {

    mostrarResultado(
      "saida",
      "Erro ao registrar saída: " +
      erro.message,
      true
    );

  }

  finally {

    botao.disabled =
      false;

    botao.textContent =
      "REGISTRAR SAÍDA";

  }

}


/* =====================================================
CALCULAR KM
===================================================== */

function calcularKm() {

  const viagem =
    lerViagem();


  if (!viagem) {

    document.getElementById(
      "kmPercorrido"
    ).textContent =
      "0";

    return;

  }


  const kmSaida =
    converterKm(
      viagem.kmSaida
    );


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
    );


  if (
    !Number.isFinite(kmSaida) ||
    !Number.isFinite(kmChegada) ||
    kmChegada < kmSaida
  ) {

    document.getElementById(
      "kmPercorrido"
    ).textContent =
      "0";

    return;

  }


  document.getElementById(
    "kmPercorrido"
  ).textContent =
    formatarKm(
      kmChegada - kmSaida
    );

}


document.getElementById(
  "kmChegada"
).addEventListener(
  "input",
  calcularKm
);


/* =====================================================
REGISTRAR CHEGADA
===================================================== */

async function registrarChegada() {

  const viagem =
    lerViagem();


  if (!viagem) {

    alert(
      "Nenhuma viagem em andamento."
    );

    atualizarTela();

    return;

  }


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
    );


  const kmSaida =
    converterKm(
      viagem.kmSaida
    );


  if (
    !Number.isFinite(kmChegada)
  ) {

    mostrarResultado(
      "chegada",
      "Informe o KM de chegada.",
      true
    );

    return;

  }


  if (
    kmChegada < kmSaida
  ) {

    mostrarResultado(
      "chegada",
      "O KM de chegada não pode ser menor que o KM de saída.",
      true
    );

    return;

  }


  const dados = {

    acao:
      "chegada",

    motorista:
      viagem.motorista,

    veiculo:
      viagem.veiculo,

    placa:
      viagem.placa,

    dataSaida:
      viagem.dataSaida,

    horaSaida:
      viagem.horaSaida,

    destino:
      viagem.destino,

    kmSaida:
      kmSaida,

    dataChegada:
      document.getElementById(
        "dataChegada"
      ).value,

    kmChegada:
      kmChegada,

    horaChegada:
      document.getElementById(
        "horaChegada"
      ).value,

    localChegada:
      document.getElementById(
        "localChegada"
      ).value.trim(),

    assinatura:
      document.getElementById(
        "assinatura"
      ).value.trim(),

    kmPercorrido:
      kmChegada - kmSaida

  };


  const botao =
    document.getElementById(
      "btnChegada"
    );


  botao.disabled =
    true;

  botao.textContent =
    "ENVIANDO...";


  try {

    const resultado =
      await enviarDados(
        dados
      );


    /*
    ==============================================
    SOMENTE DEPOIS DO SUCESSO:

    encerra a viagem.
    ==============================================
    */

    if (
      resultado.sucesso === true
    ) {

      encerrarViagem();


      document.getElementById(
        "kmChegada"
      ).value =
        "";


      document.getElementById(
        "assinatura"
      ).value =
        "";


      document.getElementById(
        "kmPercorrido"
      ).textContent =
        "0";


      document.getElementById(
        "resultadoChegada"
      ).style.display =
        "block";


      document.getElementById(
        "resultadoChegada"
      ).className =
        "resultado";


      document.getElementById(
        "resultadoChegada"
      ).textContent =
        "CHEGADA REGISTRADA! VIAGEM ENCERRADA.";


      /*
      Volta para os campos de saída.
      */

      document.getElementById(
        "motorista"
      ).value =
        "";


      document.getElementById(
        "veiculo"
      ).value =
        "";


      document.getElementById(
        "placa"
      ).value =
        "";


      document.getElementById(
        "destino"
      ).value =
        "";


      document.getElementById(
        "kmSaida"
      ).value =
        "";


      document.getElementById(
        "dataSaida"
      ).value =
        dataAtual();


      document.getElementById(
        "horaSaida"
      ).value =
        horaAtual();

    }


  }

  catch (erro) {

    mostrarResultado(
      "chegada",
      "Erro ao registrar chegada: " +
      erro.message +
      " A viagem continua aberta.",
      true
    );

  }

  finally {

    botao.disabled =
      false;

    botao.textContent =
      "REGISTRAR CHEGADA";

  }

}


/* =====================================================
MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  tipo,
  mensagem,
  erro
) {

  const id =
    tipo === "saida"
      ? "resultadoSaida"
      : "resultadoChegada";


  const elemento =
    document.getElementById(
      id
    );


  elemento.style.display =
    "block";


  elemento.textContent =
    mensagem;


  if (erro) {

    elemento.className =
      "resultado erro";

  }

  else {

    elemento.className =
      "resultado";

  }

}


/* =====================================================
INICIALIZAÇÃO
===================================================== */

document.getElementById(
  "dataSaida"
).value =
  dataAtual();


document.getElementById(
  "horaSaida"
).value =
  horaAtual();


document.getElementById(
  "dataChegada"
).value =
  dataAtual();


document.getElementById(
  "horaChegada"
).value =
  horaAtual();


/*
Quando abrir o aplicativo,
verifica se existe viagem.
*/

atualizarTela();

</script>

</body>

</html>
