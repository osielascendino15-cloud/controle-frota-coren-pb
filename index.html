<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Controle de Frota COREN-PB
  </title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f2f4f7;

      color:
        #222;

    }


    .container {

      max-width:
        700px;

      margin:
        auto;

      background:
        white;

      padding:
        25px;

      border-radius:
        12px;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.10);

    }


    h1 {

      margin-top:
        0;

      text-align:
        center;

      color:
        #075e2f;

      font-size:
        25px;

    }


    h2 {

      color:
        #075e2f;

      border-bottom:
        2px solid #075e2f;

      padding-bottom:
        8px;

      margin-top:
        30px;

    }


    label {

      display:
        block;

      margin-top:
        15px;

      margin-bottom:
        5px;

      font-weight:
        bold;

    }


    input,
    select,
    textarea {

      width:
        100%;

      padding:
        12px;

      font-size:
        16px;

      border:
        1px solid #bbb;

      border-radius:
        7px;

      background:
        white;

    }


    input[readonly] {

      background:
        #f1f1f1;

    }


    .km {

      text-align:
        right;

      font-size:
        18px;

    }


    button {

      width:
        100%;

      margin-top:
        20px;

      padding:
        14px;

      border:
        none;

      border-radius:
        8px;

      font-size:
        17px;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    .btn-saida {

      background:
        #075e2f;

      color:
        white;

    }


    .btn-chegada {

      background:
        #145da0;

      color:
        white;

    }


    .btn-pdf {

      background:
        #7b1fa2;

      color:
        white;

    }


    button:disabled {

      background:
        #999;

      cursor:
        wait;

    }


    .resultado {

      margin-top:
        15px;

      padding:
        12px;

      border-radius:
        7px;

      background:
        #eef5ef;

      color:
        #075e2f;

      font-weight:
        bold;

      text-align:
        center;

    }


    .erro {

      background:
        #ffecec;

      color:
        #a00000;

    }


    .km-resultado {

      font-size:
        22px;

      font-weight:
        bold;

      text-align:
        center;

      color:
        #075e2f;

      margin-top:
        15px;

    }


    .observacao-ajuda {

      font-size:
        13px;

      color:
        #666;

      margin-top:
        5px;

    }


    .pdf-area {

      display:
        none;

    }


    @media print {

      body {

        background:
          white;

        padding:
          0;

      }


      .container {

        box-shadow:
          none;

        max-width:
          100%;

      }


      button,
      select {

        display:
          none;

      }


      .pdf-area {

        display:
          block;

      }

    }

  </style>

</head>


<body>

  <button

    type="button"
    style="display:none"

    SALVAR CHEGADA EM PDF
  </button>

<script>

/* =====================================================
   URL DO GOOGLE APPS SCRIPT
===================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbxPQx0vFT0XZbU4nUDO0NCqF2uxfpGOlhna6N9fAKE9h5mx2rVgZ3rdFFxPvclIIh4M/exec";


/* =====================================================
   VEÍCULO / PLACA
===================================================== */

function selecionarVeiculo() {

  const select =
    document.getElementById(
      "veiculo"
    );


  const placa =
    document.getElementById(
      "placa"
    );


  const placaChegada =
    document.getElementById(
      "placaChegada"
    );


  const opcao =
    select.options[
      select.selectedIndex
    ];


  if (
    !opcao ||
    !opcao.value
  ) {

    placa.value = "";

    placaChegada.value = "";

    return;

  }


  const placaSelecionada =
    opcao.getAttribute(
      "data-placa"
    ) || "";


  placa.value =
    placaSelecionada;


  placaChegada.value =
    placaSelecionada;

}


/* =====================================================
   DATA
===================================================== */

function dataAtual() {

  const agora =
    new Date();


  return agora.getFullYear() +
    "-" +
    String(
      agora.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      agora.getDate()
    ).padStart(2, "0");

}


/* =====================================================
   HORA
===================================================== */

function horaAtual() {

  const agora =
    new Date();


  return String(
    agora.getHours()
  ).padStart(2, "0") +
    ":" +
    String(
      agora.getMinutes()
    ).padStart(2, "0");

}


/* =====================================================
   CONVERTER KM
===================================================== */

function converterKm(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return NaN;

  }


  let texto =
    String(valor)
      .trim()
      .replace(/\s/g, "");


  if (!texto) {

    return NaN;

  }


  if (
    texto.includes(".") &&
    texto.includes(",")
  ) {

    texto =
      texto
        .replace(/\./g, "")
        .replace(",", ".");

  }


  else if (
    texto.includes(",")
  ) {

    texto =
      texto.replace(",", ".");

  }


  texto =
    texto.replace(
      /[^0-9.-]/g,
      ""
    );


  const numero =
    Number(texto);


  return Number.isFinite(numero)
    ? numero
    : NaN;

}


/* =====================================================
   FORMATAR KM
===================================================== */

function formatarKm(valor) {

  if (
    !Number.isFinite(valor)
  ) {

    return "0";

  }


  return valor.toLocaleString(
    "pt-BR",
    {
      maximumFractionDigits:
        2
    }
  );

}


/* =====================================================
   DATA/HORA INICIAL
===================================================== */

document.getElementById(
  "dataSaida"
).value =
  dataAtual();


document.getElementById(
  "horaSaida"
).value =
  horaAtual();


document.getElementById(
  "dataChegada"
).value =
  dataAtual();


document.getElementById(
  "horaChegada"
).value =
  horaAtual();


/* =====================================================
   KM PERCORRIDO
===================================================== */

document.getElementById(
  "kmChegada"
).addEventListener(
  "input",
  function() {

    const saida =
      converterKm(
        document.getElementById(
          "kmSaida"
        ).value
      );


    const chegada =
      converterKm(
        this.value
      );


    if (
      !Number.isFinite(saida) ||
      !Number.isFinite(chegada) ||
      chegada < saida
    ) {

      document.getElementById(
        "kmPercorrido"
      ).textContent =
        "0";

      return;

    }


    document.getElementById(
      "kmPercorrido"
    ).textContent =
      formatarKm(
        chegada - saida
      );

  }
);


/* =====================================================
   ENVIO AO APPS SCRIPT
===================================================== */

async function enviarDados(dados) {

  const resposta =
    await fetch(
      URL_APPS_SCRIPT,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            dados
          ),

        redirect:
          "follow"

      }
    );


  const texto =
    await resposta.text();


  let resultado;


  try {

    resultado =
      JSON.parse(
        texto
      );

  }

  catch (erro) {

    console.error(
      "Resposta do servidor:",
      texto
    );


    throw new Error(
      "O servidor não retornou JSON válido."
    );

  }


  if (
    !resultado ||
    resultado.sucesso !== true
  ) {

    throw new Error(
      resultado &&
      resultado.mensagem
        ? resultado.mensagem
        : "O servidor não confirmou a gravação."
    );

  }


  return resultado;

}


/* =====================================================
   REGISTRAR SAÍDA
===================================================== */

async function registrarSaida() {

  const motorista =
    document.getElementById(
      "motorista"
    ).value.trim();


  const dataSaida =
    document.getElementById(
      "dataSaida"
    ).value;


  const horaSaida =
    document.getElementById(
      "horaSaida"
    ).value;


  const veiculo =
    document.getElementById(
      "veiculo"
    ).value.trim();


  const placa =
    document.getElementById(
      "placa"
    ).value.trim();


  const destino =
    document.getElementById(
      "destino"
    ).value.trim();


  const kmSaida =
    converterKm(
      document.getElementById(
        "kmSaida"
      ).value
    );


  const observacao =
    document.getElementById(
      "observacaoSaida"
    ).value.trim();


  if (
    !motorista ||
    !dataSaida ||
    !horaSaida ||
    !veiculo ||
    !placa ||
    !destino
  ) {

    mostrarResultado(
      "saida",
      "Preencha todos os campos da saída.",
      true
    );

    return;

  }


  if (
    !Number.isFinite(kmSaida)
  ) {

    mostrarResultado(
      "saida",
      "Informe um KM de saída válido.",
      true
    );

    return;

  }


  const dados = {

    acao:
      "saida",

    motorista:
      motorista,

    dataSaida:
      dataSaida,

    horaSaida:
      horaSaida,

    veiculo:
      veiculo,

    placa:
      placa,

    destino:
      destino,

    kmSaida:
      kmSaida,

    observacao:
      observacao

  };


  const botao =
    document.getElementById(
      "btnSaida"
    );


  botao.disabled =
    true;


  botao.textContent =
    "ENVIANDO...";


  try {

    const resultado =
      await enviarDados(
        dados
      );


    botao.disabled =
      false;


    botao.textContent =
      "REGISTRAR SAÍDA";


    mostrarResultado(
      "saida",
      resultado.mensagem ||
      "Saída registrada com sucesso na planilha.",
      false
    );


    /*
     PREENCHE AUTOMATICAMENTE
     A CHEGADA
    */

    document.getElementById(
      "motoristaChegada"
    ).value =
      motorista;


    document.getElementById(
      "veiculoChegada"
    ).value =
      veiculo;


    document.getElementById(
      "placaChegada"
    ).value =
      placa;


    /*
     Salva a viagem localmente.
    */

    salvarViagemLocal(
      dados
    );


    /*
     Mostra botão PDF.
    */

    document.getElementById(
      "btnPdfSaida"
    ).style.display =
      "block";

  }


  catch (erro) {

    botao.disabled =
      false;


    botao.textContent =
      "REGISTRAR SAÍDA";


    salvarPendente(
      dados
    );


    mostrarResultado(
      "saida",
      "ERRO AO ENVIAR PARA A PLANILHA: " +
      erro.message,
      true
    );

  }

}


/* =====================================================
   REGISTRAR CHEGADA
===================================================== */

async function registrarChegada() {

  const motorista =
    document.getElementById(
      "motoristaChegada"
    ).value.trim();


  const veiculo =
    document.getElementById(
      "veiculoChegada"
    ).value.trim();


  const placa =
    document.getElementById(
      "placaChegada"
    ).value.trim();


  const dataChegada =
    document.getElementById(
      "dataChegada"
    ).value;


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
