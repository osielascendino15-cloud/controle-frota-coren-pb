<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Controle de Frota COREN-PB</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #075e2f;
      font-size: 25px;
    }

    h2 {
      color: #075e2f;
      border-bottom: 2px solid #075e2f;
      padding-bottom: 8px;
      margin-top: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 7px;
      background: white;
    }

    .km {
      text-align: right;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-saida {
      background: #075e2f;
      color: white;
    }

    .btn-chegada {
      background: #145da0;
      color: white;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

    .resultado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      background: #eef5ef;
      color: #075e2f;
      font-weight: bold;
      text-align: center;
    }

    .erro {
      background: #ffecec;
      color: #a00000;
    }

    .km-resultado {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      color: #075e2f;
      margin-top: 15px;
    }

    .observacao {
      font-size: 13px;
      color: #666;
      margin-top: 5px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>Controle de Frota COREN-PB</h1>

  <!-- =========================
       SAÍDA
  ========================== -->

  <h2>Registro de Saída</h2>

  <label>Motorista / Condutor</label>

  <input id="motorista" type="text">


  <label>Data de Saída</label>

  <input id="dataSaida" type="date">


  <label>Hora de Saída</label>

  <input id="horaSaida" type="time">


  <label>Veículo</label>

  <input id="veiculo" type="text">


  <label>Placa</label>

  <input id="placa" type="text">


  <label>Destino</label>

  <input id="destino" type="text">


  <label>KM de Saída</label>

  <input
    id="kmSaida"
    class="km"
    type="text"
    inputmode="decimal"
    placeholder="Ex.: 10.000,50"
  >

  <div class="observacao">
    Pode digitar: 10000, 10000,50 ou 10.000,50.
  </div>


  <button
    id="btnSaida"
    class="btn-saida"
    onclick="registrarSaida()">

    REGISTRAR SAÍDA

  </button>


  <div
    id="resultadoSaida"
    class="resultado"
    style="display:none">
  </div>


  <!-- =========================
       CHEGADA
  ========================== -->

  <h2>Registro de Chegada</h2>

  <label>Motorista / Condutor</label>

  <input id="motoristaChegada" type="text">


  <label>Veículo</label>

  <input id="veiculoChegada" type="text">


  <label>Data de Chegada</label>

  <input id="dataChegada" type="date">


  <label>KM de Chegada</label>

  <input
    id="kmChegada"
    class="km"
    type="text"
    inputmode="decimal"
    placeholder="Ex.: 10.125,50"
  >

  <div class="observacao">
    Aceita: 10125, 10125,50, 10125.50 ou 10.125,50.
  </div>


  <label>Hora de Chegada</label>

  <input id="horaChegada" type="time">


  <label>Local de Chegada</label>

  <input
    id="localChegada"
    type="text"
    value="João Pessoa - PB, Sede do COREN"
  >


  <label>Assinatura do Motorista</label>

  <textarea
    id="assinatura"
    rows="4"
    placeholder="Digite o nome do motorista">
  </textarea>


  <div class="km-resultado">

    KM Percorrido:
    <span id="kmPercorrido">0</span>

  </div>


  <button
    id="btnChegada"
    class="btn-chegada"
    onclick="registrarChegada()">

    REGISTRAR CHEGADA

  </button>


  <div
    id="resultadoChegada"
    class="resultado"
    style="display:none">
  </div>

</div>


<script>

/* =====================================================
   URL DO GOOGLE APPS SCRIPT
===================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzu264tIZifiObEh9mdy0ulZGgVBjhSptcb0KuBUIfDQ3ex3NKX865GidwU8Z3MsUUM/exec";


/* =====================================================
   DATA
===================================================== */

function dataAtual() {

  const agora = new Date();

  return agora.getFullYear() +
    "-" +
    String(agora.getMonth() + 1).padStart(2,"0") +
    "-" +
    String(agora.getDate()).padStart(2,"0");

}


/* =====================================================
   HORA
===================================================== */

function horaAtual() {

  const agora = new Date();

  return String(
    agora.getHours()
  ).padStart(2,"0") +
  ":" +
  String(
    agora.getMinutes()
  ).padStart(2,"0");

}


/* =====================================================
   CONVERTER KM
===================================================== */

function converterKm(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {
    return NaN;
  }

  let texto =
    String(valor)
      .trim()
      .replace(/\s/g,"");

  if (!texto) {
    return NaN;
  }

  if (
    texto.includes(".") &&
    texto.includes(",")
  ) {

    texto =
      texto
        .replace(/\./g,"")
        .replace(",",".");
  }

  else if (
    texto.includes(",")
  ) {

    texto =
      texto.replace(",",".");
  }

  texto =
    texto.replace(
      /[^0-9.-]/g,
      ""
    );

  const numero =
    Number(texto);

  return Number.isFinite(numero)
    ? numero
    : NaN;

}


/* =====================================================
   FORMATAR KM
===================================================== */

function formatarKm(valor) {

  if (!Number.isFinite(valor)) {
    return "0";
  }

  return valor.toLocaleString(
    "pt-BR",
    {
      maximumFractionDigits: 2
    }
  );

}


/* =====================================================
   INICIAR DATA/HORA
===================================================== */

document.getElementById(
  "dataSaida"
).value = dataAtual();

document.getElementById(
  "horaSaida"
).value = horaAtual();

document.getElementById(
  "dataChegada"
).value = dataAtual();

document.getElementById(
  "horaChegada"
).value = horaAtual();


/* =====================================================
   CALCULAR KM
===================================================== */

document.getElementById(
  "kmChegada"
).addEventListener(
  "input",
  function() {

    const saida =
      converterKm(
        document.getElementById(
          "kmSaida"
        ).value
      );

    const chegada =
      converterKm(
        this.value
      );

    if (
      !Number.isFinite(saida) ||
      !Number.isFinite(chegada) ||
      chegada < saida
    ) {

      document.getElementById(
        "kmPercorrido"
      ).textContent = "0";

      return;

    }

    document.getElementById(
      "kmPercorrido"
    ).textContent =
      formatarKm(
        chegada - saida
      );

  }
);


/* =====================================================
   ENVIAR DADOS PARA O GOOGLE APPS SCRIPT
===================================================== */

async function enviarDados(dados) {

  const resposta =
    await fetch(
      URL_APPS_SCRIPT,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(dados),

        redirect: "follow"
      }
    );


  const texto =
    await resposta.text();


  let resultado;

  try {

    resultado =
      JSON.parse(texto);

  } catch (erro) {

    throw new Error(
      "O servidor não retornou uma resposta válida."
    );

  }


  if (
    !resultado ||
    resultado.sucesso !== true
  ) {

    throw new Error(
      resultado &&
      resultado.mensagem
        ? resultado.mensagem
        : "O servidor não confirmou a gravação."
    );

  }


  return resultado;

}


/* =====================================================
   REGISTRAR SAÍDA
===================================================== */

async function registrarSaida() {

  const motorista =
    document.getElementById(
      "motorista"
    ).value.trim();

  const dataSaida =
    document.getElementById(
      "dataSaida"
    ).value;

  const horaSaida =
    document.getElementById(
      "horaSaida"
    ).value;

  const veiculo =
    document.getElementById(
      "veiculo"
    ).value.trim();

  const placa =
    document.getElementById(
      "placa"
    ).value.trim();

  const destino =
    document.getElementById(
      "destino"
    ).value.trim();

  const kmSaida =
    converterKm(
      document.getElementById(
        "kmSaida"
      ).value
    );


  if (
    !motorista ||
    !dataSaida ||
    !horaSaida ||
    !veiculo ||
    !placa ||
    !destino
  ) {

    mostrarResultado(
      "saida",
      "Preencha todos os campos.",
      true
    );

    return;

  }


  if (
    !Number.isFinite(kmSaida)
  ) {

    mostrarResultado(
      "saida",
      "Informe um KM de saída válido.",
      true
    );

    return;

  }


  const dados = {

    acao: "saida",

    motorista: motorista,

    dataSaida: dataSaida,

    horaSaida: horaSaida,

    veiculo: veiculo,

    placa: placa,

    destino: destino,

    kmSaida: kmSaida

  };


  const botao =
    document.getElementById(
      "btnSaida"
    );

  botao.disabled = true;

  botao.textContent =
    "ENVIANDO...";


  try {

    const resultado =
      await enviarDados(
        dados
      );


    botao.disabled = false;

    botao.textContent =
      "REGISTRAR SAÍDA";


    mostrarResultado(
      "saida",
      resultado.mensagem ||
      "Saída registrada na planilha!",
      false
    );


    document.getElementById(
      "motoristaChegada"
    ).value = motorista;


    document.getElementById(
      "veiculoChegada"
    ).value = veiculo;


    salvarViagemLocal(
      dados
    );


  } catch (erro) {

    botao.disabled = false;

    botao.textContent =
      "REGISTRAR SAÍDA";


    salvarPendente(
      dados
    );


    mostrarResultado(
      "saida",
      "Não foi possível enviar para a planilha. " +
      "A viagem foi guardada neste celular para nova tentativa. " +
      erro.message,
      true
    );

  }

}


/* =====================================================
   REGISTRAR CHEGADA
===================================================== */

async function registrarChegada() {

  const motorista =
    document.getElementById(
      "motoristaChegada"
    ).value.trim() ||
    document.getElementById(
      "motorista"
    ).value.trim();


  const veiculo =
    document.getElementById(
      "veiculoChegada"
    ).value.trim() ||
    document.getElementById(
      "veiculo"
    ).value.trim();


  const dataChegada =
    document.getElementById(
      "dataChegada"
    ).value;


  const kmChegada =
    converterKm(
      document.getElementById(
        "kmChegada"
      ).value
    );


  const horaChegada =
    document.getElementById(
      "horaChegada"
    ).value;


  const localChegada =
    document.getElementById(
      "localChegada"
    ).value.trim();


  const assinatura =
    document.getElementById(
      "assinatura"
    ).value.trim();


  const kmSaida =
    converterKm(
      document.getElementById(
        "kmSaida"
      ).value
    );


  if (!motorista) {

    mostrarResultado(
      "chegada",
      "Informe o motorista.",
      true
    );

    return;

  }


  if (!veiculo) {

    mostrarResultado(
      "chegada",
      "Informe o veículo.",
      true
    );

    return;

  }


  if (!dataChegada) {

    mostrarResultado(
      "chegada",
      "Informe a data de chegada.",
      true
    );

    return;

  }


  if (!horaChegada) {

    mostrarResultado(
      "chegada",
      "Informe a hora de chegada.",
      true
    );

    return;

  }


  if (!Number.isFinite(kmChegada)) {

    mostrarResultado(
      "chegada",
      "Informe um KM de chegada válido.",
      true
    );

    return;

  }


  if (
    Number.isFinite(kmSaida) &&
    kmChegada < kmSaida
  ) {

    mostrarResultado(
      "chegada",
      "O KM de chegada não pode ser menor que o KM de saída.",
      true
    );

    return;

  }


  const dados = {

    acao: "chegada",

    motorista: motorista,

    veiculo: veiculo,placa:
  document.getElementById(
    "placa"
  ).value.trim().toUpperCase(),


    dataChegada: dataChegada,

    kmChegada: kmChegada,

    horaChegada: horaChegada,

    localChegada:
      localChegada ||
      "João Pessoa - PB, Sede do COREN",

    assinatura:
      assinatura

  };


  const botao =
    document.getElementById(
      "btnChegada"
    );

  botao.disabled = true;

  botao.textContent =
    "ENVIANDO...";


  try {

    const resultado =
      await enviarDados(
        dados
      );


    botao.disabled = false;

    botao.textContent =
      "REGISTRAR CHEGADA";


    mostrarResultado(
      "chegada",
      resultado.mensagem ||
      "Chegada registrada na planilha!",
      false
    );


    document.getElementById(
      "kmChegada"
    ).value = "";


    document.getElementById(
      "kmPercorrido"
    ).textContent = "0";


    limparViagemLocal();


  } catch (erro) {

    botao.disabled = false;

    botao.textContent =
      "REGISTRAR CHEGADA";


    salvarPendente(
      dados
    );


    mostrarResultado(
      "chegada",
      "Não foi possível enviar para a planilha. " +
      "Os dados foram guardados neste celular. " +
      erro.message,
      true
    );

  }

}


/* =====================================================
   GUARDAR VIAGEM LOCALMENTE
===================================================== */

function salvarViagemLocal(dados) {

  try {

    localStorage.setItem(
      "controleFrotaViagemAberta",
      JSON.stringify(dados)
    );

  } catch (erro) {

    console.error(
      "Erro ao salvar viagem local:",
      erro
    );

  }

}


/* =====================================================
   LIMPAR VIAGEM LOCAL
===================================================== */

function limparViagemLocal() {

  try {

    localStorage.removeItem(
      "controleFrotaViagemAberta"
    );

  } catch (erro) {

    console.error(
      "Erro ao limpar viagem local:",
      erro
    );

  }

}


/* =====================================================
   GUARDAR DADOS PENDENTES
===================================================== */

function salvarPendente(dados) {

  try {

    const pendentes =
      JSON.parse(
        localStorage.getItem(
          "controleFrotaPendentes"
        ) || "[]"
      );


    pendentes.push({

      data:
        new Date().toISOString(),

      dados:
        dados

    });


    localStorage.setItem(
      "controleFrotaPendentes",
      JSON.stringify(
        pendentes
      )
    );


  } catch (erro) {

    console.error(
      "Erro ao salvar pendência:",
      erro
    );

  }

}


/* =====================================================
   ENVIAR PENDÊNCIAS
===================================================== */

async function enviarPendencias() {

  try {

    const pendentes =
      JSON.parse(
        localStorage.getItem(
          "controleFrotaPendentes"
        ) || "[]"
      );


    if (
      !Array.isArray(pendentes) ||
      pendentes.length === 0
    ) {

      return;

    }


    const restantes = [];


    for (
      const item of pendentes
    ) {

      try {

        await enviarDados(
          item.dados
        );

      } catch (erro) {

        restantes.push(
          item
        );

      }

    }


    localStorage.setItem(
      "controleFrotaPendentes",
      JSON.stringify(
        restantes
      )
    );


  } catch (erro) {

    console.error(
      "Erro ao enviar pendências:",
      erro
    );

  }

}


/* =====================================================
   QUANDO VOLTAR A INTERNET
===================================================== */

window.addEventListener(
  "online",
  function() {

    enviarPendencias();

  }
);


/* =====================================================
   RESTAURAR VIAGEM
===================================================== */

function restaurarViagemLocal() {

  try {

    const texto =
      localStorage.getItem(
        "controleFrotaViagemAberta"
      );


    if (!texto) {
      return;
    }


    const dados =
      JSON.parse(
        texto
      );


    if (!dados) {
      return;
    }


    if (dados.motorista) {

      document.getElementById(
        "motorista"
      ).value =
        dados.motorista;


      document.getElementById(
        "motoristaChegada"
      ).value =
        dados.motorista;

    }


    if (dados.veiculo) {

      document.getElementById(
        "veiculo"
      ).value =
        dados.veiculo;


      document.getElementById(
        "veiculoChegada"
      ).value =
        dados.veiculo;

    }


    if (dados.dataSaida) {

      document.getElementById(
        "dataSaida"
      ).value =
        dados.dataSaida;

    }


    if (dados.horaSaida) {

      document.getElementById(
        "horaSaida"
      ).value =
        dados.horaSaida;

    }


    if (dados.placa) {

      document.getElementById(
        "placa"
      ).value =
        dados.placa;

    }


    if (dados.destino) {

      document.getElementById(
        "destino"
      ).value =
        dados.destino;

    }


    if (
      dados.kmSaida !== undefined
    ) {

      document.getElementById(
        "kmSaida"
      ).value =
        formatarKm(
          Number(
            dados.kmSaida
          )
        );

    }

  } catch (erro) {

    console.error(
      "Erro ao restaurar viagem:",
      erro
    );

  }

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  tipo,
  mensagem,
  erro
) {

  const elemento =
    document.getElementById(
      tipo === "saida"
        ? "resultadoSaida"
        : "resultadoChegada"
    );


  elemento.style.display =
    "block";


  elemento.textContent =
    mensagem;


  if (erro) {

    elemento.classList.add(
      "erro"
    );

  } else {

    elemento.classList.remove(
      "erro"
    );

  }

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

restaurarViagemLocal();

enviarPendencias();

</script>

</body>

</html>
