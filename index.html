<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Frota COREN-PB</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.header {
  background: #07579c;
  color: white;
  text-align: center;
  padding: 25px 15px;
  border-radius: 0 0 18px 18px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.card {
  background: white;
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: 0;
  border-radius: 8px;
  background: #07579c;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

#resultado {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  display: none;
}

.sucesso {
  display: block !important;
  background: #d4edda;
  color: #155724;
}

.erro {
  display: block !important;
  background: #f8d7da;
  color: #721c24;
}

.km {
  margin-top: 15px;
  padding: 12px;
  background: #eef5fb;
  text-align: center;
  border-radius: 8px;
  font-weight: bold;
  color: #07579c;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🚗 CONTROLE DE FROTA</h1>
    <p>COREN-PB</p>
  </div>

  <div class="card">

    <form id="formulario">

      <label>Motorista</label>
      <input id="motorista" type="text" required>

      <label>E-mail</label>
      <input id="email" type="email" required>

      <label>Veículo</label>
      <input id="veiculo" type="text" required>

      <label>Placa</label>
      <input id="placa" type="text" maxlength="7" required>

      <label>KM de Saída</label>
      <input id="kmSaida" type="number" min="0" required>

      <label>KM de Chegada</label>
      <input id="kmChegada" type="number" min="0" required>

      <div class="km">
        KM PERCORRIDO: <span id="kmPercorrido">0</span> KM
      </div>

      <button id="botao" type="submit">
        REGISTRAR MOVIMENTAÇÃO
      </button>

      <div id="resultado"></div>

    </form>

  </div>

</div>

<script>

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxPQx0vFT0XZbU4nUDO0NCqF2uxfpGOlhna6N9fAKE9h5mx2rVgZ3rdFFxPvclIIh4M/exec";

const formulario = document.getElementById("formulario");
const kmSaida = document.getElementById("kmSaida");
const kmChegada = document.getElementById("kmChegada");
const kmPercorrido = document.getElementById("kmPercorrido");
const resultado = document.getElementById("resultado");
const botao = document.getElementById("botao");

function calcularKM() {

  const saida = Number(kmSaida.value);
  const chegada = Number(kmChegada.value);

  if (chegada >= saida) {
    kmPercorrido.textContent = chegada - saida;
  } else {
    kmPercorrido.textContent = "0";
  }
}

kmSaida.addEventListener("input", calcularKM);
kmChegada.addEventListener("input", calcularKM);

document.getElementById("placa").addEventListener("input", function() {
  this.value = this.value.toUpperCase();
});

formulario.addEventListener("submit", async function(event) {

  event.preventDefault();

  const saida = Number(kmSaida.value);
  const chegada = Number(kmChegada.value);

  if (chegada < saida) {

    resultado.textContent =
      "O KM de chegada não pode ser menor que o KM de saída.";

    resultado.className = "erro";

    return;
  }

  const dados = {

    motorista: document.getElementById("motorista").value.trim(),

    email: document.getElementById("email").value.trim(),

    veiculo: document.getElementById("veiculo").value.trim(),

    placa: document.getElementById("placa").value.trim(),

    kmSaida: kmSaida.value,

    kmChegada: kmChegada.value

  };

  botao.disabled = true;
  botao.textContent = "SALVANDO...";

  resultado.className = "";
  resultado.style.display = "none";

  try {

    await fetch(URL_APPS_SCRIPT, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(dados)

    });

    resultado.textContent =
      "Movimentação enviada com sucesso!";

    resultado.className = "sucesso";

    formulario.reset();

    kmPercorrido.textContent = "0";

  } catch (erro) {

    resultado.textContent =
      "Não foi possível enviar o registro.";

    resultado.className = "erro";

  }

  botao.disabled = false;
  botao.textContent = "REGISTRAR MOVIMENTAÇÃO";

});

</script>

</body>
</html>
