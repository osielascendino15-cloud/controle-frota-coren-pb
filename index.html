<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Controle de Frota COREN-PB</title>

<style>

body {
    font-family: Arial;
    background: #f2f2f2;
    margin: 0;
}

header {
    background: #075985;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    padding: 15px;
    max-width: 600px;
    margin: auto;
}

.caixa {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 10px;
}

h2 {
    color: #075985;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.saida {
    background: green;
}

.chegada {
    background: red;
}

.registro {
    background: #f5f5f5;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
}

</style>

</head>

<body>

<header>

<h1>🚗 CONTROLE DE FROTA</h1>

<p>COREN-PB</p>

</header>

<div class="container">

<div class="caixa">

<h2>Motorista e veículo</h2>

<label>Nome do motorista</label>

<input
id="motorista"
type="text"
placeholder="Digite seu nome">

<label>E-mail</label>

<input
id="email"
type="email"
placeholder="Digite seu Gmail">

<label>Veículo</label>

<input
id="veiculo"
type="text"
placeholder="Ex.: Fiat Cronos">

<label>Placa</label>

<input
id="placa"
type="text"
placeholder="Ex.: ABC1D23">

</div>


<div class="caixa">

<h2>🟢 Saída</h2>

<label>KM de saída</label>

<input
id="kmSaida"
type="number"
placeholder="Digite o KM">

<button
class="saida"
onclick="registrarSaida()">

REGISTRAR SAÍDA

</button>

</div>


<div class="caixa">

<h2>🔴 Chegada</h2>

<label>KM de chegada</label>

<input
id="kmChegada"
type="number"
placeholder="Digite o KM">

<button
class="chegada"
onclick="registrarChegada()">

REGISTRAR CHEGADA

</button>

</div>


<div class="caixa">

<h2>📋 Histórico</h2>

<div id="historico">

Nenhuma viagem registrada.

</div>

</div>

</div>


<script>

let viagem = null;

let historico =
JSON.parse(
localStorage.getItem("frota")
) || [];


function registrarSaida() {

let motorista =
document.getElementById("motorista").value;

let email =
document.getElementById("email").value;

let veiculo =
document.getElementById("veiculo").value;

let placa =
document.getElementById("placa").value;

let km =
document.getElementById("kmSaida").value;


if (
!motorista ||
!email ||
!veiculo ||
!placa ||
!km
) {

alert(
"Preencha todos os campos."
);

return;

}


viagem = {

motorista: motorista,

email: email,

veiculo: veiculo,

placa: placa,

kmSaida: km,

horaSaida:
new Date().toLocaleString("pt-BR")

};


alert(
"Saída registrada com sucesso!"
);

}


function registrarChegada() {

if (!viagem) {

alert(
"Primeiro registre a saída."
);

return;

}


let kmChegada =
document.getElementById("kmChegada").value;


if (!kmChegada) {

alert(
"Digite o KM de chegada."
);

return;

}


let kmPercorrido =
Number(kmChegada) -
Number(viagem.kmSaida);


viagem.kmChegada =
kmChegada;

viagem.kmPercorrido =
kmPercorrido;

viagem.horaChegada =
new Date().toLocaleString("pt-BR");


historico.push(viagem);


localStorage.setItem(
"frota",
JSON.stringify(historico)
);


viagem = null;


alert(
"Chegada registrada com sucesso!"
);


mostrarHistorico();

}


function mostrarHistorico() {

let area =
document.getElementById("historico");

area.innerHTML = "";


if (historico.length === 0) {

area.innerHTML =
"Nenhuma viagem registrada.";

return;

}


historico
.slice()
.reverse()
.forEach(function(item) {

area.innerHTML += `

<div class="registro">

<b>Motorista:</b>
${item.motorista}<br>

<b>Veículo:</b>
${item.veiculo}<br>

<b>Placa:</b>
${item.placa}<br>

<b>Saída:</b>
${item.kmSaida} KM<br>

<b>Chegada:</b>
${item.kmChegada} KM<br>

<b>KM percorrido:</b>
${item.kmPercorrido} KM<br>

<b>Data/hora saída:</b>
${item.horaSaida}<br>

<b>Data/hora chegada:</b>
${item.horaChegada}

</div>

`;

});

}


mostrarHistorico();

</script>

</body>

</html>
