<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Controle de Frota COREN-PB</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #07579c;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 18px 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
    }

    .card {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input[readonly] {
      background: #f5f5f5;
    }

    .km-input {
      text-align: right;
    }

    .observacao {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-saida {
      background: #198754;
    }

    .btn-chegada {
      background: #dc3545;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

    #mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
      line-height: 1.4;
    }

    .sucesso {
      display: block !important;
      background: #d4edda;
      color: #155724;
    }

    .erro {
      display: block !important;
      background: #f8d7da;
      color: #721c24;
    }

    .aviso {
      display: block !important;
      background: #fff3cd;
      color: #856404;
    }

    .km {
      margin-top: 15px;
      padding: 14px 12px;
      background: #eef5fb;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      color: #07579c;
      font-size: 18px;
    }

    #areaChegada {
      display: none;
    }

    #campoLocalChegada {
      display: none;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      background: #fff3cd;
      color: #856404;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      line-height: 1.4;
    }

    .rodape {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
      padding-bottom: 20px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>🚗 CONTROLE DE FROTA</h1>

    <p>COREN-PB</p>

  </div>


  <div class="card">

    <form id="formulario">

      <!-- =========================
           SAÍDA
      ========================== -->

      <label>
        Motorista / Condutor
      </label>

      <input
        id="motorista"
        type="text"
        placeholder="Nome do motorista"
        autocomplete="name"
        required
      >


      <label>
        Data de Saída
      </label>

      <input
        id="dataSaida"
        type="date"
        readonly
        required
      >


      <label>
        Hora de Saída
      </label>

      <input
        id="horaSaida"
        type="time"
        required
      >


      <label>
        Veículo
      </label>

      <select
        id="veiculo"
        required
      >

        <option value="">
          Selecione o veículo
        </option>

        <option
          value="Sandero"
          data-placa="OFC-4143"
        >
          Sandero - OFC-4143
        </option>

        <option
          value="Frontier"
          data-placa="PWC-1227"
        >
          Frontier - PWC-1227
        </option>

        <option
          value="Kicks-SLC-8F20"
          data-placa="SLC-8F20"
        >
          Kicks - SLC-8F20
        </option>

        <option
          value="Kicks-SLC-8F50"
          data-placa="SLC-8F50"
        >
          Kicks - SLC-8F50
        </option>

        <option
          value="Kicks-SLC-8F40"
          data-placa="SLC-8F40"
        >
          Kicks - SLC-8F40
        </option>

      </select>


      <label>
        Placa
      </label>

      <input
        id="placa"
        type="text"
        maxlength="8"
        placeholder="Placa"
        readonly
        required
      >


      <label>
        Destino
      </label>

      <input
        id="destino"
        type="text"
        placeholder="Destino"
        required
      >


      <label>
        KM de Saída
      </label>

      <input
        id="kmSaida"
        class="km-input"
        type="text"
        inputmode="decimal"
        placeholder="Ex.: 10.000,50"
        autocomplete="off"
        required
      >

      <div class="observacao">
        Aceita: 10000, 10000,50, 10000.50 ou 10.000,50.
      </div>


      <button
        id="botaoSaida"
        class="btn-saida"
        type="button"
      >

        🟢 SALVAR KM DE SAÍDA

      </button>


      <div
        id="status"
        class="status"
      >

        Nenhuma viagem em andamento.

      </div>


      <!-- =========================
           CHEGADA
      ========================== -->

      <div id="areaChegada">

        <label>
          Data de Chegada
        </label>

        <input
          id="dataChegada"
          type="date"
          readonly
        >


        <label>
          KM de Chegada
        </label>

        <input
          id="kmChegada"
          class="km-input"
          type="text"
          inputmode="decimal"
          placeholder="Ex.: 10.125,50"
          autocomplete="off"
        >

        <div class="observacao">
          Aceita: 10125, 10125,50, 10125.50 ou 10.125,50.
        </div>


        <label>
          Hora de Chegada
        </label>

        <input
          id="horaChegada"
          type="time"
          readonly
        >


        <div id="campoLocalChegada">

          <label>
            Local de Chegada
          </label>

          <input
            id="localChegada"
            type="text"
            value="João Pessoa - PB, Sede do COREN"
            readonly
          >

        </div>


        <div class="km">

          KM PERCORRIDO:

          <span id="kmPercorrido">
            0
          </span>

          KM

        </div>


        <label>
          ✍️ Assinatura do Motorista
        </label>

        <input
          id="assinatura"
          type="text"
          placeholder="Digite o nome completo do motorista"
          autocomplete="name"
        >


        <button
          id="botaoChegada"
          class="btn-chegada"
          type="button"
        >

          🔴 ENCERRAR VIAGEM

        </button>

      </div>


      <div id="mensagem"></div>

    </form>

  </div>


  <div class="rodape">
    Controle de Frota COREN-PB
  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbxPQx0vFT0XZbU4nUDO0NCqF2uxfpGOlhna6N9fAKE9h5mx2rVgZ3rdFFxPvclIIh4M/exec";


/* =====================================================
   ELEMENTOS
===================================================== */

const formulario =
  document.getElementById("formulario");

const motorista =
  document.getElementById("motorista");

const dataSaida =
  document.getElementById("dataSaida");

const horaSaida =
  document.getElementById("horaSaida");

const veiculo =
  document.getElementById("veiculo");

const placa =
  document.getElementById("placa");

const destino =
  document.getElementById("destino");

const kmSaida =
  document.getElementById("kmSaida");

const dataChegada =
  document.getElementById("dataChegada");

const kmChegada =
  document.getElementById("kmChegada");

const horaChegada =
  document.getElementById("horaChegada");

const localChegada =
  document.getElementById("localChegada");

const campoLocalChegada =
  document.getElementById("campoLocalChegada");

const assinatura =
  document.getElementById("assinatura");

const botaoSaida =
  document.getElementById("botaoSaida");

const botaoChegada =
  document.getElementById("botaoChegada");

const areaChegada =
  document.getElementById("areaChegada");

const kmPercorrido =
  document.getElementById("kmPercorrido");

const mensagem =
  document.getElementById("mensagem");

const status =
  document.getElementById("status");


/* =====================================================
   CHAVES DO LOCAL STORAGE
===================================================== */

const CHAVE_VIAGEM =
  "viagemAberta";

const CHAVE_PENDENTES =
  "controleFrotaPendentes";


/* =====================================================
   DATA ATUAL
===================================================== */

function dataAtual() {

  const agora =
    new Date();

  return (
    agora.getFullYear() +
    "-" +
    String(
      agora.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      agora.getDate()
    ).padStart(2, "0")
  );

}


/* =====================================================
   HORA ATUAL
===================================================== */

function horaAtual() {

  const agora =
    new Date();

  return (
    String(
      agora.getHours()
    ).padStart(2, "0") +
    ":" +
    String(
      agora.getMinutes()
    ).padStart(2, "0")
  );

}


/* =====================================================
   CONVERTER KM
===================================================== */

function converterKm(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return NaN;

  }


  let texto =
    String(valor)
      .trim()
      .replace(/\s/g, "");


  if (!texto) {

    return NaN;

  }


  /*
    Exemplos:

    10.000,50
    -> 10000.50

    10000,50
    -> 10000.50

    10000.50
    -> 10000.50

    10000
    -> 10000
  */

  if (
    texto.includes(".") &&
    texto.includes(",")
  ) {

    texto =
      texto
        .replace(/\./g, "")
        .replace(",", ".");

  }

  else if (
    texto.includes(",")
  ) {

    texto =
      texto.replace(",", ".");

  }


  texto =
    texto.replace(
      /[^0-9.-]/g,
      ""
    );


  const numero =
    Number(texto);


  if (
    Number.isFinite(numero)
  ) {

    return numero;

  }


  return NaN;

}


/* =====================================================
   FORMATAR KM
===================================================== */

function formatarKm(valor) {

  if (
    !Number.isFinite(valor)
  ) {

    return "0";

  }


  return valor.toLocaleString(
    "pt-BR",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  );

}


/* =====================================================
   MOSTRAR MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo
) {

  mensagem.textContent =
    texto;

  mensagem.className =
    tipo;

}


/* =====================================================
   LIMPAR MENSAGEM
===================================================== */

function limparMensagem() {

  mensagem.textContent =
    "";

  mensagem.className =
    "";

}


/* =====================================================
   SELEÇÃO DO VEÍCULO
===================================================== */

veiculo.addEventListener(
  "change",
  function() {

    const opcao =
      veiculo.options[
        veiculo.selectedIndex
      ];


    if (!opcao) {

      placa.value =
        "";

      return;

    }


    const placaSelecionada =
      opcao.getAttribute(
        "data-placa"
      );


    placa.value =
      placaSelecionada || "";

  }
);


/* =====================================================
   DESABILITAR CAMPOS DA SAÍDA
===================================================== */

function bloquearCamposSaida() {

  motorista.disabled =
    true;

  dataSaida.disabled =
    true;

  horaSaida.disabled =
    true;

  veiculo.disabled =
    true;

  placa.disabled =
    true;

  destino.disabled =
    true;

  kmSaida.disabled =
    true;

}


/* =====================================================
   LIBERAR CAMPOS DA SAÍDA
===================================================== */

function liberarCamposSaida() {

  motorista.disabled =
    false;

  dataSaida.disabled =
    false;

  horaSaida.disabled =
    false;

  veiculo.disabled =
    false;

  placa.disabled =
    false;

  destino.disabled =
    false;

  kmSaida.disabled =
    false;

}


/* =====================================================
   MOSTRAR VIAGEM EM ANDAMENTO
===================================================== */

function mostrarViagemEmAndamento() {

  bloquearCamposSaida();


  botaoSaida.style.display =
    "none";


  areaChegada.style.display =
    "block";


  status.textContent =
    "🚗 VIAGEM EM ANDAMENTO — informe o KM de chegada.";

}


/* =====================================================
   SALVAR VIAGEM ABERTA
===================================================== */

function salvarViagemLocal(dados) {

  try {

    localStorage.setItem(
      CHAVE_VIAGEM,
      JSON.stringify(dados)
    );

    return true;

  } catch (erro) {

    console.error(
      "Erro ao salvar viagem:",
      erro
    );

    return false;

  }

}


/* =====================================================
   LER VIAGEM ABERTA
===================================================== */

function obterViagemLocal() {

  try {

    const texto =
      localStorage.getItem(
        CHAVE_VIAGEM
      );


    if (!texto) {

      return null;

    }


    return JSON.parse(texto);

  } catch (erro) {

    console.error(
      "Erro ao ler viagem:",
      erro
    );

    return null;

  }

}


/* =====================================================
   REMOVER VIAGEM ABERTA
===================================================== */

function removerViagemLocal() {

  try {

    localStorage.removeItem(
      CHAVE_VIAGEM
    );

  } catch (erro) {

    console.error(
      "Erro ao remover viagem:",
      erro
    );

  }

}


/* =====================================================
   SALVAR PENDÊNCIA
===================================================== */

function salvarPendente(dados) {

  try {

    const texto =
      localStorage.getItem(
        CHAVE_PENDENTES
      );


    let pendentes = [];


    if (texto) {

      pendentes =
        JSON.parse(texto);

    }


    if (
      !Array.isArray(pendentes)
    ) {

      pendentes = [];

    }


    pendentes.push({

      id:
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2),

      data:
        new Date().toISOString(),

      dados:
        dados

    });


    localStorage.setItem(
      CHAVE_PENDENTES,
      JSON.stringify(
        pendentes
      )
    );


  } catch (erro) {

    console.error(
      "Erro ao salvar pendência:",
      erro
    );

  }

}


/* =====================================================
   ENVIAR DADOS
===================================================== */

async function enviarDados(dados) {

  /*
    O Apps Script normalmente trabalha
    com POST e texto JSON.
  */

  const resposta =
    await fetch(
      URL_APPS_SCRIPT,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(dados),

        redirect:
          "follow"
      }
    );


  const texto =
    await resposta.text();


  if (!texto) {

    /*
      Alguns deployments do Apps Script
      podem não devolver corpo legível.

      Nesse caso, não tratamos como erro
      automaticamente.
    */

    return {
      sucesso: true,
      mensagem:
        "Dados enviados para o servidor."
    };

  }


  try {

    const resultado =
      JSON.parse(texto);


    if (
      resultado &&
      resultado.sucesso === false
    ) {

      throw new Error(
        resultado.mensagem ||
        "O servidor recusou os dados."
      );

    }


    return (
      resultado || {
        sucesso: true
      }
    );

  } catch (erro) {

    /*
      Se o servidor respondeu algo que
      não é JSON, mas o HTTP foi aceito,
      consideramos o envio concluído.
    */

    return {
      sucesso: true,
      mensagem:
        "Dados enviados para o servidor."
    };

  }

}


/* =====================================================
   ENVIAR PENDÊNCIAS
===================================================== */

async function enviarPendencias() {

  try {

    const texto =
      localStorage.getItem(
        CHAVE_PENDENTES
      );


    if (!texto) {

      return;

    }


    let pendentes =
      JSON.parse(texto);


    if (
      !Array.isArray(pendentes) ||
      pendentes.length === 0
    ) {

      return;

    }


    const restantes = [];


    for (
      const item of pendentes
    ) {

      try {

        await enviarDados(
          item.dados
        );

      } catch (erro) {

        console.error(
          "Falha ao reenviar pendência:",
          erro
        );

        restantes.push(
          item
        );

      }

    }


    localStorage.setItem(
      CHAVE_PENDENTES,
      JSON.stringify(
        restantes
      )
    );


  } catch (erro) {

    console.error(
      "Erro ao processar pendências:",
      erro
    );

  }

}


/* =====================================================
   RESTAURAR VIAGEM
===================================================== */

function restaurarViagem() {

  const dados =
    obterViagemLocal();


  if (!dados) {

    dataSaida.value =
      dataAtual();

    horaSaida.value =
      horaAtual();

    status.textContent =
      "Nenhuma viagem em andamento.";

    return;

  }


  motorista.value =
    dados.motorista || "";


  dataSaida.value =
    dados.dataSaida ||
    dataAtual();


  horaSaida.value =
    dados.horaSaida ||
    horaAtual();


  veiculo.value =
    dados.veiculo || "";


  placa.value =
    dados.placa || "";


  destino.value =
    dados.destino || "";


  if (
    dados.kmSaida !== undefined &&
    dados.kmSaida !== null
  ) {

    kmSaida.value =
      formatarKm(
        Number(
          dados.kmSaida
        )
      );

  }


  motorista.value =
    dados.motorista || "";


  mostrarViagemEmAndamento();

}


/* =====================================================
   ATUALIZAR KM PERCORRIDO
===================================================== */

function atualizarKmPercorrido() {

  const saida =
    converterKm(
      kmSaida.value
    );


  const chegada =
    converterKm(
      kmChegada.value
    );


  if (
    !Number.isFinite(saida) ||
    !Number.isFinite(chegada) ||
    chegada < saida
  ) {

    kmPercorrido.textContent =
      "0";

    return;

  }


  kmPercorrido.textContent =
    formatarKm(
      chegada - saida
    );


  dataChegada.value =
    dataAtual();


  horaChegada.value =
    horaAtual();


  localChegada.value =
    "João Pessoa - PB, Sede do COREN";


  campoLocalChegada.style.display =
    "block";

}


/* =====================================================
   EVENTO KM CHEGADA
===================================================== */

kmChegada.addEventListener(
  "input",
  atualizarKmPercorrido
);


/* =====================================================
   REGISTRAR SAÍDA
===================================================== */

botaoSaida.addEventListener(
  "click",
  async function() {

    limparMensagem();


    if (
      !formulario.checkValidity()
    ) {

      formulario.reportValidity();

      return;

    }


    const km =
      converterKm(
        kmSaida.value
      );


    if (
      !Number.isFinite(km) ||
      km < 0
    ) {

      mostrarMensagem(
        "Informe um KM de saída válido.",
        "erro"
      );

      kmSaida.focus();

      return;

    }


    /*
      Impede duas viagens abertas
      ao mesmo tempo.
    */

    const viagemExistente =
      obterViagemLocal();


    if (viagemExistente) {

      mostrarMensagem(
        "Já existe uma viagem em andamento neste dispositivo.",
        "erro"
      );

      mostrarViagemEmAndamento();

      return;

    }


    const dados = {

      acao:
        "saida",

      dataSaida:
        dataSaida.value,

      motorista:
        motorista.value.trim(),

      horaSaida:
        horaSaida.value,

      veiculo:
        veiculo.value,

      placa:
        placa.value
          .trim()
          .toUpperCase(),

      destino:
        destino.value.trim(),

      kmSaida:
        km

    };


    botaoSaida.disabled =
      true;

    botaoSaida.textContent =
      "SALVANDO...";


    /*
      Primeiro salvamos localmente.

      Assim, mesmo que a internet caia
      imediatamente depois do clique,
      a viagem não desaparece.
    */

    salvarViagemLocal(
      dados
    );


    try {

      const resultado =
        await enviarDados(
          dados
        );


      mostrarMensagem(
        resultado.mensagem ||
        "KM de saída salvo com sucesso!",
        "sucesso"
      );


      mostrarViagemEmAndamento();


    } catch (erro) {

      /*
        A viagem continua aberta
        localmente.

        Também guardamos uma cópia
        para tentar enviar novamente.
      */

      salvarPendente(
        dados
      );


      mostrarMensagem(
        "A viagem foi salva neste celular, " +
        "mas não foi possível enviar para a planilha agora. " +
        "O sistema tentará novamente quando a conexão voltar.",
        "aviso"
      );


      mostrarViagemEmAndamento();

    }


    botaoSaida.disabled =
      false;

    botaoSaida.textContent =
      "🟢 SALVAR KM DE SAÍDA";

  }
);


/* =====================================================
   REGISTRAR CHEGADA
===================================================== */

botaoChegada.addEventListener(
  "click",
  async function() {

    limparMensagem();


    /*
      Verifica se existe viagem aberta.
    */

    const viagem =
      obterViagemLocal();


    if (!viagem) {

      mostrarMensagem(
        "Nenhuma viagem em andamento foi encontrada.",
        "erro"
      );

      return;

    }


    /*
      KM de chegada
    */

    const kmFinal =
      converterKm(
        kmChegada.value
      );


    if (
      !Number.isFinite(kmFinal) ||
      kmFinal < 0
    ) {

      mostrarMensagem(
        "Informe um KM de chegada válido.",
        "erro"
      );

      kmChegada.focus();

      return;

    }


    const kmInicial =
      converterKm(
        viagem.kmSaida
      );


    if (
      !Number.isFinite(kmInicial)
    ) {

      mostrarMensagem(
        "O KM de saída da viagem não é válido.",
        "erro"
      );

      return;

    }


    if (
      kmFinal < kmInicial
    ) {

      mostrarMensagem(
        "O KM de chegada não pode ser menor que o KM de saída.",
        "erro"
      );

      kmChegada.focus();

      return;

    }


    /*
      Assinatura
    */

    const nomeAssinatura =
      assinatura.value.trim();


    if (!nomeAssinatura) {

      mostrarMensagem(
        "Digite o nome do motorista no campo Assinatura.",
        "erro"
      );

      assinatura.focus();

      return;

    }


    /*
      Data e hora são registradas
      no momento do encerramento.
    */

    const dataFinal =
      dataAtual();

    const horaFinal =
      horaAtual();


    dataChegada.value =
      dataFinal;


    horaChegada.value =
      horaFinal;


    localChegada.value =
      "João Pessoa - PB, Sede do COREN";


    campoLocalChegada.style.display =
      "block";


    kmPercorrido.textContent =
      formatarKm(
        kmFinal - kmInicial
      );


    /*
      DADOS COMPLETOS DA VIAGEM
    */

    const dados = {

      acao:
        "chegada",

      dataSaida:
        viagem.dataSaida,

      motorista:
        viagem.motorista,

      horaSaida:
        viagem.horaSaida,

      veiculo:
        viagem.veiculo,

      placa:
        viagem.placa,

      destino:
        viagem.destino,

      kmSaida:
        kmInicial,

      dataChegada:
        dataFinal,

      kmChegada:
        kmFinal,

      horaChegada:
        horaFinal,

      localChegada:
        "João Pessoa - PB, Sede do COREN",

      assinatura:
        nomeAssinatura,

      kmPercorrido:
        kmFinal - kmInicial

    };


    botaoChegada.disabled =
      true;

    botaoChegada.textContent =
      "ENCERRANDO...";


    try {

      const resultado =
        await enviarDados(
          dados
        );


      /*
        Só removemos a viagem aberta
        depois que o envio foi aceito.
      */

      removerViagemLocal();


      mostrarMensagem(
        resultado.mensagem ||
        "Viagem encerrada com sucesso!",
        "sucesso"
      );


      /*
        Limpa a tela para uma
        nova viagem.
      */

      formulario.reset();


      dataSaida.value =
        dataAtual();


      horaSaida.value =
        horaAtual();


      dataChegada.value =
        "";


      horaChegada.value =
        "";


      localChegada.value =
        "João Pessoa - PB, Sede do COREN";


      kmPercorrido.textContent =
        "0";


      campoLocalChegada.style.display =
        "none";


      areaChegada.style.display =
        "none";


      botaoSaida.style.display =
        "block";


      liberarCamposSaida();


      status.textContent =
        "Nenhuma viagem em andamento.";


    } catch (erro) {

      /*
        NÃO apagamos a viagem local.

        Isso permite que o usuário tente
        novamente sem perder os dados.
      */

      salvarPendente(
        dados
      );


      mostrarMensagem(
        "Não foi possível enviar o encerramento para a planilha. " +
        "A viagem continua salva neste celular e os dados foram colocados na fila para nova tentativa.",
        "aviso"
      );


      /*
        Mantém a viagem aberta.
      */

      mostrarViagemEmAndamento();

    }


    botaoChegada.disabled =
      false;

    botaoChegada.textContent =
      "🔴 ENCERRAR VIAGEM";

  }
);


/* =====================================================
   INTERNET VOLTOU
===================================================== */

window.addEventListener(
  "online",
  function() {

    enviarPendencias();

  }
);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
  "load",
  function() {

    restaurarViagem();

    enviarPendencias();

  }
);

</script>
